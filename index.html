<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>שורשים וכנפיים | מפת הצמיחה שלי</title><style>
@font-face{font-family:'Varale Round';src:local('Varale Round'),url('/assets/varale-round.woff2') format('woff2');font-display:swap}
:root{--navy:#062f4b;--turquoise:#17a7b8;--mist:#d8eff0;--cream:#fffdf3;--gold:#e7a52f;--sage:#9ac6b9;color-scheme:light}

:root{font-family:'Varale Round',Arial,sans-serif;color:var(--navy);background:var(--cream)}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;background:var(--cream);flex-wrap:wrap;gap:14px}nav{display:flex;flex-wrap:wrap;gap:22px}nav a{color:var(--navy);text-decoration:none;font-size:14px}.logo{font-weight:800;font-size:21px}.shell{max-width:1050px;margin:auto;padding:30px 20px}.hero{min-height:550px;display:grid;align-content:center;background:radial-gradient(ellipse at 17% 28%,#d0e8e5 0,transparent 34%),radial-gradient(ellipse at 82% 75%,#f1dca9 0,transparent 38%),#faf8f1;position:relative}.hero h1{font-size:clamp(60px,10vw,120px);line-height:.98;margin:0;color:#123e52}.script{font-size:clamp(22px,4vw,42px);font-style:italic;color:#207b87;margin-top:20px}.sub{font-size:clamp(18px,2vw,24px);margin:22px 0;line-height:1.6}button{cursor:pointer;background:var(--navy);color:white;border:0;border-radius:30px;padding:14px 26px;font-weight:700;font-size:16px}button.secondary{background:transparent;color:var(--navy);border:1px solid #478691}button:disabled{opacity:.35;cursor:not-allowed}.card{background:white;border:1px solid #dbe4e0;border-radius:22px;padding:28px;margin:20px 0;box-shadow:0 4px 20px #163b4310}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.choice{display:block;border:1px solid #d3e3df;border-radius:14px;padding:16px;background:var(--cream);cursor:pointer}.choice:has(input:checked){border-color:#108f91;background:#e2f6f3}input[type=text],select{padding:13px;border:1px solid #bfd5d1;border-radius:12px;width:100%;font-size:16px}label{line-height:1.6}.bar{background:var(--mist);border-radius:20px;height:12px;overflow:hidden}.bar>span{display:block;background:linear-gradient(90deg,var(--navy),var(--turquoise),var(--sage));height:100%}.muted{color:#667d82}h2{font-size:clamp(25px,4vw,37px)}.tag{display:inline-block;padding:7px 12px;background:var(--mist);border-radius:20px;color:#146c70;font-size:13px}footer{text-align:center;padding:30px;font-size:13px;color:#667d82}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}@media(max-width:700px){header{padding:16px}nav{gap:10px}.hero{min-height:470px}.shell{padding:22px 16px}}
header,nav,button,.card{font-family:'Varale Round',Arial,sans-serif} .hero{background-color:var(--cream)!important}.hero h1{color:var(--navy)} .script{color:#057b99}.card{border-color:var(--mist)}button:hover{filter:brightness(1.09)}
</style><header><div class="logo">✦ שורשים וכנפיים</div><nav><a href="#home">בית</a><a href="#journey">המסע שלי</a><a href="#catalog">מפת ההזדמנויות</a><a href="#how">איך זה עובד</a><a href="#about">אודות</a></nav><a href="#journey">כניסה</a></header><main id="app"></main><footer>מקיף ז׳ אשדוד | גרסת הדגמה בלבד · אין שמירת נתונים במאגר מרכזי</footer><script>
const Q=[
["קיבלת יום שלם שבו מותר לך ללמוד כל דבר שתרצה. לאן תלך?","מעבדה לפיצוח תעלומות|אולפן מוזיקה או צילום|מרכז לפיתוח משחקים|מרכז ספורט ואתגרים|חדר דיונים ומנהיגות|מסע לחקר אנשים ותרבויות",3],
["חברים מתכננים פרויקט גדול. איזה תפקיד טבעי לך?","להציע רעיונות|לארגן משימות|לעזור לאנשים לשתף פעולה|לפתור בעיות טכניות|לעצב תוצר|להציג מול קהל",2],
["מה יכול לגרום לך לשכוח מהשעה?","בניית דברים|מוזיקה|שיחות עמוקות|ספורט|כתיבה|פתרון חידות|משחקי מחשב|ניסויים|עזרה לאחרים",3],
["נתקלת בבעיה קשה. מה תהיה התגובה הראשונה?","לנסות בדרך אחרת|לחקור את הבעיה|להתייעץ עם אחרים|לתכנן פתרון|לבדוק באופן מעשי|להבין את ההקשר",1],
["אם יכולת לשפר משהו בבית הספר, מה היית בוחר?","סיוע לתלמידים|ציוד טכנולוגי|מרחב יצירה|פעילות ספורט|יוזמה סביבתית|דיבייט וחופש ביטוי",2],
["איזו מחמאה תשמח אותך במיוחד?","יש לך רעיונות|אפשר לסמוך עליך|אתה יודע להקשיב|אתה לא מוותר|אתה מסביר מצוין|אתה חושב לעומק",2],
["נכנסת למקום חדש. מה סביר שתעשה?","אתחיל שיחה|אתבונן ואלמד|אחפש פעילות|אתחבר לאדם אחד|אשאל שאלות|אתחיל ממשימה",1],
["איזה סוג אתגר היה מסקרן אותך?","לתכנת רובוט|להפיק סרט|להוביל יוזמה חברתית|לחקור תעלומה מדעית|להשתתף בדיבייט|לחקור אירוע היסטורי|להתחרות בספורט",3],
["מתי אתה מרגיש שיצא ממך משהו טוב?","כשהבנתי משהו קשה|כשעזרתי למישהו|כשיצרתי|כששיפרתי שיא|כשהצגתי בפני קהל|כשעבדתי עם קבוצה",2],
["איזה סרטון יעצור אותך בגלילה?","תגלית מדעית|סיפור אנושי|המצאה|מוזיקה|ספורט|חידה|אירוע היסטורי|דיון על סוגיה חברתית",3],
["קיבלת קופסה עם חומרים בלי הוראות. מה תעשה?","אבנה ואגלה|אתכנן מראש|אחפש השראה|אעבוד עם חברים|אנסה משהו נועז|אחקור את החומרים",1],
["אילו יכולות היית שמח לקבל?","ביטחון מול קהל|חשיבה יצירתית|מנהיגות|תכנות|כתיבה|שפות|נגינה|פתרון בעיות|הקשבה|חשיבה ביקורתית",4],
["איזו שאלה היית רוצה לפצח?","איך המוח עובד|איך בונים משחק|איך משנים דעות|למה אנשים מתנהגים אחרת|איך בונים עסק|איך נוצרת תרבות",2],
["מה נותן לך אנרגיה במשימה מאתגרת?","לראות התקדמות|להתחרות בעצמי|לעבוד עם חברים|לגלות הפתעה|לעזור למישהו|לנסות בחופשיות|להגיע לדיוק",2],
["למי היית מצטרף ליום עבודה?","חוקרת חלל|מעצב משחקים|רופאה|במאי קולנוע|מהנדסת|פעיל חברתי|עיתונאית חוקרת|משפטנית|היסטוריון",3],
["איזה משפט מתאר אותך?","אני מבחין בפרטים|יש לי רעיונות|אני מחבר בין אנשים|אני אוהב להבין מערכות|אני עובד בידיים|אני אוהב לעזור|אני אוהב להביע עמדה",2],
["איזה מועדון היית מקים?","חדשנות|מוזיקה|דיבייט|ספורט|התנדבות|צילום וקולנוע|מדע|פילוסופיה והיסטוריה",3],
["איך הכי נוח לך להתחיל ללמוד עולם חדש?","להתנסות|לצפות בהדגמה|לקרוא ולחקור|ללמוד עם חבר|לשמוע הסבר|לבנות תוצר",2],
["איזה הישג בעוד שנה יגרום לך להתגאות?","למדתי מיומנות|יזמתי שינוי|העזתי להופיע|הצלחתי בתחרות|יצרתי יצירה|התמדתי|העמקתי בנושא שחשוב לי",3],
["איזו דלת היית רוצה לפתוח?","מדע ומחקר|טכנולוגיה|אמנות|מנהיגות|חברה וקהילה|ספורט|רפואה|שפות ותרבויות|משפט ופילוסופיה",3]
];
const dims=["מדע וחקר","טכנולוגיה וחדשנות","חברה ורוח","אמנות ויצירה","מנהיגות ויוזמה","ספורט ואתגר"];
const programs=["לימודי אקדמיה","לימודי לוויינות וחלל","מגשימים – מצוינות טכנולוגית","ניצנים Pro – תכנות מתקדם","חידון התנ״ך","חידון היסטוריה","מש״צים – מדריכי של״ח צעירים","תחרות דן דוד לנאומים","חבורת זמר","אולימפיאדת הביולוגיה","אולימפיאדת הפיזיקה","נבחרת כדורסל","נבחרת כדורגל","צופן תרבות – ארכאולוגיה ומדעים"];
const state=JSON.parse(localStorage.getItem("rw-demo")||'{"idx":0,"answers":{},"name":"","grade":"י׳","klass":"1","current":[],"future":[]}');
function save(){localStorage.setItem("rw-demo",JSON.stringify(state))}function tag(s){return '<span class="tag">'+s+'</span>'}function view(s){document.querySelector("#app").innerHTML=s;window.scrollTo(0,0)}
function home(){view('<section class="hero"><div class="shell"><h1>שורשים<br>וכנפיים</h1><div class="script">המסע שלי. העתיד שלי.</div><div class="sub">מגלים חוזקות, בוחרים מסלולים ויוצרים מפת צמיחה אישית<br><small>מכיתה ז׳ עד י״ב</small></div><div class="actions"><button onclick="location.hash=\'#start\'">מתחילים עכשיו ←</button><button class="secondary" onclick="location.hash=\'#how\'">לגלות עוד</button></div></div></section><div class="shell"><div class="grid"><div class="card"><h2>מגלים</h2>20 שאלות של סקרנות ובחירה</div><div class="card"><h2>מכירים</h2>מפת תחומי עניין והמלצות</div><div class="card"><h2>בוחרים</h2>מסלולי צמיחה לשנה ולעתיד</div></div></div>')}
function start(){view('<div class="shell"><h2>נעים להכיר</h2><div class="card"><label>הכינוי שלי<input id="nick" type="text" maxlength="32" value="'+(state.name||'')+'"></label><label>שכבה<select id="grade">'+["ז׳","ח׳","ט׳","י׳","י״א","י״ב"].map(g=>'<option '+(state.grade===g?'selected':'')+'>'+g+'</option>').join('')+'</select></label><label>כיתה<input id="klass" type="text" value="'+state.klass+'"></label><div class="actions"><button onclick="state.name=document.querySelector(\'#nick\').value||\'סקרנ/ית\';state.grade=document.querySelector(\'#grade\').value;state.klass=document.querySelector(\'#klass\').value;save();location.hash=\'#quiz\'">יוצאים למסע ←</button></div><p class="muted">בגרסת ההדגמה הנתונים נשמרים בדפדפן בלבד.</p></div></div>')}
function quiz(){const q=Q[state.idx],selected=state.answers[state.idx]||[];view('<div class="shell">'+tag("שאלה "+(state.idx+1)+" מתוך 20")+'<div class="card"><div class="bar"><span style="width:'+((state.idx+1)*5)+'%"></span></div><h2>'+q[0]+'</h2><p class="muted">בחרו עד '+q[2]+' תשובות</p><div class="grid">'+q[1].split("|").map((o,i)=>'<label class="choice"><input type="checkbox" '+(selected.includes(i)?'checked':'')+' onchange="answer('+i+')"> '+o+'</label>').join('')+'</div><div class="actions"><button class="secondary" onclick="state.idx=Math.max(0,state.idx-1);save();quiz()">הקודמת</button><button '+(!selected.length?'disabled':'')+' onclick="state.idx<19?(state.idx++,save(),quiz()):(location.hash=\'#profile\')">'+(state.idx===19?'לפרופיל שלי':'הבאה')+' ←</button></div></div></div>')}
function answer(i){let a=state.answers[state.idx]||[],mx=Q[state.idx][2];a=a.includes(i)?a.filter(x=>x!==i):a.length<mx?[...a,i]:a;state.answers[state.idx]=a;save();quiz()}
function ranked(){const scores=Array(6).fill(0);Object.entries(state.answers).forEach(([q,ids])=>ids.forEach(i=>{let w=(Number(q)+i)%6;scores[w]+=1;let opt=Q[Number(q)][1].split("|")[i]||"";if(/חבר|אנש|חברתי|היסטור|תרבות|פילוסופ|שפות|סיפור/.test(opt))scores[2]+=2;if(/מדע|חקר|ניסוי|רפוא|חלל/.test(opt))scores[0]+=2;if(/מחשב|תכנות|רובוט|משחק/.test(opt))scores[1]+=2;if(/אמנות|מוזיקה|עיצוב|כתיבה|צילום|סרט/.test(opt))scores[3]+=2;if(/מנהיג|מוביל|עזרה|התנדב|יוזמ/.test(opt))scores[4]+=2;if(/ספורט|התמד|תחרות/.test(opt))scores[5]+=2}));let max=Math.max(1,...scores);return scores.map((x,i)=>({name:dims[i],v:Math.round(x/max*100)})).sort((a,b)=>b.v-a.v)}
function profile(){if(!Object.keys(state.answers).length)return location.hash="#start";let d=ranked(), rec=programs.filter((x,i)=> d[0].name.includes("חברה")?/היסטור|תנ״ך|דן דוד|תרבות/.test(x):d[0].name.includes("מדע")?/אקדמ|חלל|ביולוג|פיזיק/.test(x):true).slice(0,4);while(rec.length<4)rec.push(programs[rec.length]);view('<div class="shell">'+tag("פרופיל הצמיחה שלך")+'<h2>'+state.name+', יש לך רעיונות. עכשיו אפשר לתת להם כנפיים.</h2><div class="card">מהבחירות שלך עולה עניין במיוחד ב<strong> '+d.slice(0,2).map(x=>x.name).join(" וב־")+'</strong>. אלה העדפות שמסמנות כיוונים להתנסות, ולא אבחון של היכולות שלך.</div><h2>החוזקות והנטיות שעולות מהתשובות</h2><div class="grid">'+d.slice(0,4).map(x=>'<div class="card">'+tag("✦")+'<h3>'+x.name+'</h3>תחום שיכול לפתוח עבורך אפשרויות חדשות</div>').join('')+'</div><h2>מפת תחומי העניין שלך</h2><p class="muted">מדדים יחסיים לצורך הדגמה, לא ציון מאומת.</p>'+d.map(x=>'<p>'+x.name+' · '+x.v+'/100</p><div class="bar"><span style="width:'+x.v+'%"></span></div>').join('')+'<h2>התוכניות שהייתי מציע לך לבדוק</h2>'+rec.map((x,i)=>'<div class="card">'+tag("המלצה "+(i+1))+'<h3>'+x+'</h3><p>מסלול שכדאי לבדוק בהקשר של תחומי העניין שלך.</p><p class="muted">מועד הצטרפות ותנאי קבלה: טרם אומתו</p></div>').join('')+'<button onclick="location.hash=\'#choose\'">לבחירת תוכניות ←</button></div>')}
function choose(){view('<div class="shell"><h2>הבחירות שלי</h2><p>בחרו לפחות מסלול אחד לשנה ושני מסלולים לשנים הבאות.</p><h3>השנה אני רוצה...</h3><div class="grid">'+programs.map((p,i)=>'<label class="choice"><input type="checkbox" '+(state.current.includes(i)?'checked':'')+' onchange="pick('+i+',\'current\')">'+p+'</label>').join('')+'</div><h3>בשנים הבאות...</h3><p>'+state.future.length+'/2</p><div class="grid">'+programs.map((p,i)=>'<label class="choice"><input type="checkbox" '+(state.future.includes(i)?'checked':'')+(state.future.length>=2&&!state.future.includes(i)?' disabled':'')+' onchange="pick('+i+',\'future\')">'+p+'</label>').join('')+'</div><div class="actions"><button '+(!state.current.length||state.future.length!==2?'disabled':'')+' onclick="location.hash=\'#journey\'">לסיכום הבחירות ←</button></div></div>')}
function pick(i,key){let a=state[key];state[key]=a.includes(i)?a.filter(x=>x!==i):key==="future"&&a.length>=2?a:[...a,i];save();choose()}
function journey(){view('<div class="shell"><h2>המסע שלי · '+(state.name||'')+'</h2><div class="card"><h3>השנה בחרתי</h3>'+(state.current.map(i=>'<p>✓ '+programs[i]+'</p>').join('')||'עדיין לא נבחרו תוכניות')+'<h3>לשנים הבאות</h3>'+(state.future.map(i=>'<p>✦ '+programs[i]+'</p>').join('')||'עדיין לא נבחרו תוכניות')+'<p class="muted">שמירה מקומית בדפדפן בלבד. אין כרגע כניסת מחנכת או שמירה מרכזית.</p><button onclick="window.print()">הדפסת סיכום</button></div></div>')}
function catalog(){view('<div class="shell"><h2>מפת ההזדמנויות</h2><p class="muted">קטלוג ראשוני להדגמה. פרטי גיל והרשמה דורשים השלמה.</p><div class="grid">'+programs.map(x=>'<div class="card"><h3>'+x+'</h3>פרטי הרשמה בבדיקה</div>').join('')+'</div></div>')}
function route(){let h=location.hash.slice(1);({start,quiz,profile,choose,journey,catalog,home,how:home,about:home}[h]||home)()}addEventListener("hashchange",route);route();
</script></html>
