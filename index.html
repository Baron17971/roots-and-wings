 P006:{"lead":"מגשימים סייבר – לפתור את האתגרים הטכנולוגיים של המחר","sections":[["על התוכנית","מגשימים סייבר היא תוכנית מצוינות טכנולוגית לתלמידי כיתות י׳–י״ב, המעניקה ידע מעמיק במדעי המחשב ובמערכות מחשוב ומפתחת יכולות להתמודד עם אתגרים טכנולוגיים מורכבים."],["מה לומדים?","שפות תכנות, תקשורת מחשבים, רשתות, מערכות הפעלה, עקרונות אבטחת מידע והגנת סייבר וכן פיתוח פתרונות תוכנה."],["מבנה הלימודים","שלוש שנות לימוד בכיתות י׳–י״ב, שני מפגשי לימוד שבועיים אחר הצהריים, ימי העשרה, כנסי סייבר, מחנות קיץ ופרויקט גמר בכיתה י״ב בליווי מנטורים מחברות הייטק."],["קהל יעד ותנאי קבלה","תלמידי כיתה ט׳ מהפריפריה הגיאוגרפית והחברתית, בעלי מוטיבציה גבוהה, סקרנות טכנולוגית ונכונות להתמיד. אין צורך בידע קודם בתכנות. הקבלה מותנית בתהליך מיון."],["מה מרוויחים?","יכולות תכנות מתקדמות, חשיבה לוגית, פתרון בעיות, למידה עצמאית, עבודת צוות וחשיפה ליחידות הטכנולוגיות של צה״ל ולתעשיית ההייטק, ללא הבטחת קבלה."],["מידע והרשמה","פרטים ומועדי הרשמה באתר התוכנית: https://www.magshimim.cyber.org.il/about"]]},
 P007:{"lead":"ניצנים Junior – מגלים את עולם התוכנה","sections":[["על התוכנית","תוכנית ניצנים היא תוכנית טכנולוגית של עמותת בנתיבי אודי, בשיתוף אגף התקשוב וההגנה בסייבר בצה״ל ושותפים נוספים. היא מאפשרת לתלמידי חטיבת הביניים להיחשף לעולם התכנות, להתנסות בפתרון אתגרים טכנולוגיים ולפתח בסיס ללימודים מתקדמים."],["מה לומדים?","היכרות עם עקרונות התכנות וכתיבת קוד, פיתוח חשיבה לוגית וחישובית, התנסות בפתרון בעיות ואתגרים באמצעות תכנות ופיתוח למידה עצמאית, יצירתיות ועבודת צוות."],["מבנה הלימודים","מסלול Junior מיועד לכיתות ט׳, מתקיים במסגרת החינוך הפורמלי וכולל כ־40 שעות לימוד וחשיפה בבית הספר. הפעלתו תלויה בקיום המסלול בבית הספר."],["למי זה מתאים?","לתלמידי כיתה ט׳ בעלי זיקה טכנולוגית, סקרנות ורצון להעמיק בלימודי תכנות."],["מה מרוויחים?","בסיס בעולם התוכנה, פיתוח יכולות חשיבה ופתרון בעיות, היכרות עם מסלולי השירות הטכנולוגי בצה״ל והכנה אפשרית להמשך במסלול ניצנים Pro."],["מידע והרשמה","למידע מעודכן על התוכנית: https://nitzanim.udi.org.il/"]]},
 P008:{"lead":"ניצנים Pro – מהיכרות עם קוד ליצירת פתרונות טכנולוגיים","sections":[["על התוכנית","ניצנים Pro היא תוכנית מצוינות טכנולוגית תלת־שנתית של עמותת בנתיבי אודי, שפותחה בשיתוף בית הספר למקצועות המחשב של צה״ל. התוכנית מאפשרת לבני נוער מהפריפריה הגיאוגרפית והחברתית לרכוש ידע מתקדם בפיתוח תוכנה, להתנסות בפרויקטים מעשיים ולהיחשף לעולמות התעשייה והיחידות הטכנולוגיות בצה״ל."],["מה לומדים?","יסודות התכנות בשפת Python והתקדמות לפרויקטים מורכבים; פיתוח תוכנה ומשחקי מחשב; היכרות עם Full Stack, למידת מכונה (Machine Learning) ו־DevOps; פתרון בעיות, חשיבה חישובית ועבודה בצוות."],["מבנה הלימודים","שלוש שנים בכיתות י׳–י״ב ובהיקף של כ־450 שעות לימוד. מפגש קבוצתי שבועי בן שלוש שעות אחר הצהריים, מטלת בית שבועית ומרחב תרגול מקוון בהיקף של כשעתיים, שלושה ימי העשרה מקצועיים וחברתיים בשנה, מחנה קיץ למצטיינים וליווי מנטורים מהצבא, האקדמיה והתעשייה."],["קהל יעד ותנאי קבלה","תלמידים העולים לכיתה י׳ הלומדים במסלול של 4–5 יח״ל מתמטיקה ו־5 יח״ל אנגלית, בעלי סקרנות, התמדה ומוטיבציה ללמוד תכנות. אין צורך בידע קודם במחשבים או בהשתתפות קודמת בניצנים Junior. המיון כולל מבחן חשיבה לוגית וריאיון אישי מקוון; בעלי ידע קודם עשויים להשתלב בקבוצת מתקדמים."],["מה מרוויחים?","ידע מעשי בתכנות ובפיתוח תוכנה, חשיבה טכנולוגית, עצמאות לימודית, התנסות בפרויקטים והכנה אפשרית למיונים לתפקידים טכנולוגיים בצה״ל. ההשתתפות אינה מבטיחה קבלה ליחידות אלה."],["עלות והרשמה","לפי פרטי ההרשמה לתשפ״ז, דמי הרישום המסובסדים הם 1,000 ₪ לשלוש שנים, ויש אפשרות לבקש הנחה. יש לבדוק תעריפים ומועדים עדכניים באתר התוכנית: https://nitzanim.udi.org.il/nitzanim-pro/ וכן https://nitzanim.udi.org.il/הרשמה/"]]},
 P009:{"lead":"אודיסיאה – כשהסקרנות הופכת למחקר אקדמי","sections":[["על התוכנית","אודיסיאה היא תוכנית מצוינות לתלמידים מצטיינים ומחוננים של מרכז מדעני העתיד מקרן מיימונידיס, בשיתוף משרד החינוך ומוסדות אקדמיים בישראל. היא מאפשרת לימודים אקדמיים במדעים, התנסות במחקר ולמידה לצד חוקרים ואנשי אקדמיה."],["מה לומדים?","לימודים אקדמיים בתחומים כגון פיזיקה, מתמטיקה, כימיה, ביולוגיה ומדעי המחשב; מסלולי התמחות כדוגמת סייבר, בינה מלאכותית והנדסה, בהתאם למוסד האקדמי; התנסות במעבדות מחקר, חשיבה ביקורתית ופתרון בעיות מורכבות."],["מבנה הלימודים","ארבע שנות לימוד מכיתה ט׳ ועד י״ב במקביל ללימודים בבית הספר, הכוללות מפגשים אקדמיים, ימי לימוד מרוכזים, מעבדות והעשרה. הימים, השעות והמסלולים משתנים לפי המוסד האקדמי."],["למי מתאים ותנאי קבלה","מיועד לתלמידי כיתה ח׳ מצטיינים במיוחד, בעלי יכולת גבוהה במדעים ובמתמטיקה, סקרנות, התמדה ומוכנות לעומס לימודי משמעותי. המיון מתחיל בכיתה ח׳ וכולל בחינות ושלבים ייעודיים של המוסד, לרבות מכינת קיץ בהתאם למסלול."],["מה מרוויחים?","ידע מתקדם וניסיון מחקרי, אפשרות לצבירת נקודות זכות אקדמיות בהתאם למסלול ולהישגים, מפגש עם חוקרים ומרצים ופיתוח עצמאות, חשיבה מדעית ויכולת להתמודד עם אתגרים מורכבים."],["עלות והרשמה","השתתפות עשויה להיות כרוכה בתשלום וניתן לברר מלגות מול המוסד. למחזור הקרוב פורסם מועד הרשמה מ־15.11.2026 עד 17.1.2027; יש לבדוק מועדים ותנאים עדכניים באתר: https://www.madaney.net/odyssey"]]},
 P010:{"lead":"אלפא – מהשאלה הראשונה למחקר מדעי אמיתי","sections":[["על התוכנית","תוכנית אלפא היא תוכנית מצוינות מדעית של מרכז מדעני העתיד מקרן מיימונידיס, בשיתוף משרד החינוך ומוסדות אקדמיים בישראל. התלמידים משתלבים במחקר מדעי אמיתי בהנחיית חוקרים מהאקדמיה וכותבים עבודת מחקר ברמה אקדמית בהיקף של 5 יחידות לימוד לבגרות."],["מה לומדים ועושים?","מכירים שיטות מחקר, קוראים מאמרים מדעיים, בוחרים תחום ומגבשים שאלת מחקר והשערות, מתנסים במחקר ובניתוח נתונים, מבצעים עבודה עצמאית בהנחיית חוקר או חוקרת, כותבים עבודת מחקר ומציגים את ממצאיה. תחומי המחקר משתנים לפי המוסד וכוללים בין היתר מדעי החיים, כימיה, פיזיקה, מדעי המחשב, מתמטיקה והנדסה."],["מבנה הלימודים","המיון מתקיים במהלך כיתה ט׳. המחקר וההכשרה נמשכים בעיקר בכיתות י׳–י״א, ולעיתים יש פעילות המשך בכיתה י״ב. התוכנית כוללת הכנה למחקר, מחנה קיץ, מפגשים אקדמיים, עבודה מחקרית מונחית ופעילות חברתית. היקף הפעילות משתנה בין מוסדות."],["קהל יעד ותנאי קבלה","תלמידי כיתה ט׳ מצטיינים ומחוננים, בעלי עניין עמוק במדעים, עצמאות, התמדה ונכונות להשקיע במחקר. תהליך המיון כולל בחינה ארצית, מיונים אקדמיים וריאיון, ובחלק מהמסלולים גם מכינת קיץ."],["מה מרוויחים?","ניסיון ממשי במחקר אקדמי, מיומנויות חקר וכתיבה מדעית, עבודת מחקר בהיקף 5 יח״ל לבגרות, היכרות עם חוקרים ופיתוח עצמאות, חשיבה ביקורתית והתמדה."],["עלות והרשמה","ההשתתפות בתוכנית מסובסדת במלואה ואינה כרוכה בתשלום. למחזור הקרוב פורסמה הרשמה מ־15.11.2026 עד 17.1.2027; יש לבדוק תנאים ומועדים מעודכנים באתר הרשמי: https://www.madaney.net/alpha"]]},
 P011:{"lead":"אות רמון – מנהיגות, מצוינות ותרומה לחברה","sections":[["על התוכנית","אות רמון היא תוכנית מנהיגות ארצית של קרן רמון, בהשראת מורשת אילן, רונה ואסף רמון. היא מטפחת צעירים וצעירות המשלבים מצוינות אישית עם אחריות חברתית, יוזמה ומחויבות לקהילה."],["מה כוללת התוכנית?","מפגשים עם מנהיגים, אנשי ציבור, יזמים ומובילי דעה; סדנאות מנהיגות ופיתוח אישי; היכרות עם קבוצות שונות בחברה הישראלית; חניכה וליווי אישי; והשתלבות בקהילת בוגרים המעודדת עשייה חברתית מתמשכת."],["מבנה התוכנית","מדי שנה נבחרת קבוצה מצומצמת של כ־15–17 תלמידים ותלמידות מרחבי הארץ. הנבחרים משתתפים לאורך השנה במפגשי מנהיגות, העשרה, התנסות ופיתוח מיומנויות."],["למי זה מתאים ומהם תנאי הקבלה?","לתלמידים מצטיינים בעלי הישגים גבוהים, מנהיגות מוכחת, יוזמה והתנדבות משמעותית. הבחירה כוללת הגשת מועמדות, סינון והערכה. שכבת ההגשה המדויקת — י״א או י״ב — נקבעת בהתאם לקול הקורא העדכני של קרן רמון."],["מה מרוויחים?","הכרה ארצית במצוינות ובמנהיגות חברתית, פיתוח יכולות הובלה ויוזמה, מפגש עם מובילי דעה, קשרים משמעותיים וקהילת בוגרים."],["מידע והרשמה","המועדים ותנאי הקבלה משתנים משנה לשנה. יש לבדוק את הקול הקורא באתר הרשמי: https://ramonfoundation.org.il/?page_id=8094"]]},
 P012:{"lead":"קהילות מחוברות – שונים באורחות החיים, שותפים בעתיד","sections":[["על היוזמה","קהילות מחוברות היא יוזמה חינוכית של מקיף ז׳ אשדוד, הפועלת זו השנה הרביעית בשיתוף ישיבת אמי״ת יגל ומדרשת שחרי באשדוד. היא נולדה מתוך אמונה שהיכרות אמיתית בין תלמידים מהחינוך הממלכתי ומהחינוך הממלכתי־דתי יכולה לגשר על פערים, להפחית דעות קדומות ולסייע בבניית חברה ישראלית טובה, סובלנית ומלוכדת יותר."],["מה כוללת התוכנית?","מפגשי היכרות, שיח וגיבוש בין תלמידי בתי הספר, בקבוצות בנים ובנות נפרדות; מפגשים ושיתופי פעולה בין המחנכים; יוזמות התנדבות ועשייה חברתית משותפת; ופעילויות סביב מועדים בלוח השנה."],["תוכנית שצומחת משנה לשנה","היוזמה מתקיימת כבר ארבע שנים, מתפתחת ומתרחבת משכבה לשכבה. מה שהחל כמפגש והיכרות התפתח לתהליך חינוכי מתמשך המחבר בין תלמידים, מחנכים וקהילות."],["למי זה מתאים?","לתלמידים המשתתפים בשכבות שבהן פועלת התוכנית ומעוניינים להכיר אורחות חיים שונים, לפתח קשרים חברתיים ולתרום לחברה ישראלית המחברת בין זהויות וקהילות."],["מה מרוויחים?","היכרות עם האחר, חיזוק הזהות האישית, פיתוח הקשבה וכבוד הדדי, יצירת חברויות ושיתופי פעולה, ותחושת שותפות ואחריות לעתידה של החברה בישראל."],["המסר המוביל","לא צריך להיות דומים כדי להיות שייכים. צריך להכיר, להקשיב ולגלות כמה כוח יש בחיבור בינינו."]]},
 P014:{"lead":"מדעניות העתיד – לגלות יכולות, לפרוץ גבולות, לעצב את העתיד","sections":[["על התוכנית","תוכנית מדעניות העתיד, ביוזמת משרד החדשנות, המדע והטכנולוגיה, נועדה לעודד נערות לבחור בתחומי המדע, ההנדסה והטכנולוגיה, לפתח מצוינות לימודית ולחזק את ביטחונן ביכולתן להשתלב במסלולים מדעיים מתקדמים. התוכנית פועלת גם באשדוד ומכון ברנקו וייס נמנה עם מפעיליה."],["מה לומדים ועושים?","העשרה במדעים מדויקים, מתמטיקה ומקצועות טכנולוגיים; חיזוק הישגים לימודיים; התנסות בניסויים, חקר וסדנאות; סיורים במוסדות אקדמיים ובתעשייה; מפגשים עם מדעניות ומהנדסות מובילות; ופיתוח ביטחון עצמי, מנהיגות ומיומנויות חברתיות."],["מבנה התוכנית","מסגרת העשרה רב־שנתית בחינוך הבלתי פורמלי, הכוללת מפגשי אחר הצהריים וימי העשרה מרוכזים. היקף השעות המדויק ושכבות ההשתתפות עשויים להשתנות לפי המחזור וההפעלה המקומית באשדוד."],["קהל יעד ותנאי קבלה","תלמידות בחטיבת הביניים ובתיכון בעלות הישגים טובים, סקרנות מדעית, מוטיבציה ונכונות ללמידה מתמשכת. תנאי הקבלה, שכבת הכניסה ומספר המקומות נקבעים לפי המחזור והרשות המקומית."],["מה מרוויחים?","חיזוק ידע והישגים במדעים, תחושת מסוגלות וביטחון עצמי, חשיפה להזדמנויות באקדמיה ובמקצועות STEM, היכרות עם נשים פורצות דרך וכלים להמשך התפתחות אישית ומקצועית."],["מידע נוסף","פרטי ההפעלה וההרשמה העדכניים נקבעים ברמה המקומית. מידע על התוכנית באתר מכון ברנקו וייס: https://brancoweiss.org.il/programs/מדעניות-העתיד/"]]},
 P015:{"lead":"כיתה סגולה – מטוב למצוין","sections":[["על היוזמה","כיתה סגולה היא יוזמה פנימית של מקיף ז׳ אשדוד, הפועלת בחטיבה העליונה במטרה להגדיל את מספר התלמידים המתקדמים לקראת תעודת בגרות מצטיינת. הדגש הוא על תלמידים בעלי פוטנציאל גבוה, הנמצאים קרוב לסף ההצטיינות אך עדיין אינם עומדים בכל הדרישות."],["איך פועלת התוכנית?","רכזת ייעודית מלווה את התלמידים, מסייעת להם לזהות את הפער שבין הישגיהם הנוכחיים לבין יעד ההצטיינות, להציב מטרות לימודיות ולהתמיד בתהליך שיפור. הליווי מכוון להעביר תלמידים מטוב למצוין."],["למי זה מתאים?","לתלמידי החטיבה העליונה במקיף ז׳ בעלי הישגים טובים ופוטנציאל להצטיינות, הזקוקים להכוונה ולליווי ממוקד בדרך לעמידה בדרישות תעודת בגרות מצטיינת."],["מהי מטרת התוכנית?","להגדיל את מספר התלמידים הזכאים לתעודת בגרות מצטיינת, באמצעות ליווי אישי, חיזוק מוטיבציה, הגדרת יעדים והתקדמות לימודית ממוקדת."],["המסר המוביל","מטוב למצוין – מזהים את הפוטנציאל, מציבים יעד ומתקדמים אליו."]]},
 P016:{"lead":"ים כחול ירוק – מהיכרות עם הטבע לאחריות סביבתית","sections":[["על התוכנית","ים כחול ירוק היא תוכנית חינוכית עירונית המשותפת למינהל החינוך בעיריית אשדוד ולאיגוד ערים לאיכות הסביבה אשדוד–חבל יבנה. היא מחברת בין למידה על הסביבה המקומית לבין מנהיגות ועשייה חברתית, ומעודדת אחריות לשמירת חופי הים ונחל לכיש."],["מה לומדים ועושים?","היכרות עם המערכת האקולוגית של הים התיכון, החי והצומח בחופים; התמודדות עם זיהום ים, פלסטיק ומיקרופלסטיק, דיג יתר ומינים פולשים; עקרונות קיימות וצריכה אחראית; סיורים בחופי אשדוד ובנחל לכיש; והובלת יוזמות הסברה ופעילות סביבתית בקהילה."],["מבנה התוכנית","התוכנית משלבת למידה עיונית וחווייתית עם סיורי שטח ופעילות מעשית. בפרסומים משנים קודמות מתוארים סיורים בנחל לכיש, הרצאות מומחי סביבה, הכשרת תלמידים מובילים ופעילות מועצות ירוקות. בעבר השתתפו גם תלמידי כיתות י׳ ממקיף ז׳ בהדרכת עמותת אקואושן. מתכונת ההפעלה עשויה להשתנות משנה לשנה."],["למי זה מתאים?","לתלמידים בעלי עניין בטבע, בים, במדעים ובשמירה על הסביבה, הרוצים להתנסות במנהיגות, הדרכה ועשייה למען הקהילה."],["מה מרוויחים?","פיתוח מודעות סביבתית, היכרות עם אתגרי הקיימות ועם הסביבה המקומית, חיזוק מיומנויות מנהיגות ועבודת צוות ותחושת מסוגלות להשפיע על המרחב שבו אנו חיים."],["המסר המוביל","הים הוא חלק מהבית שלנו. האחריות לשמור עליו היא של כולנו."]]},
 P018:{"lead":"חבורת זמר – קולות שונים, הרמוניה אחת","sections":[["על חבורת הזמר","חבורת הזמר של מקיף ז׳ אשדוד מהווה מסגרת אמנותית וחברתית המאפשרת לתלמידים להביא לידי ביטוי את כישרונם המוזיקלי, להתפתח כזמרים וכמבצעים ולחוות את כוחה של יצירה משותפת. באמצעות שירה בהרכב, חזרות והופעות, התלמידים מפתחים ביטחון עצמי, הקשבה, אחריות ושייכות לבית הספר."],["מה עושים בחבורת הזמר?","פיתוח יכולות קוליות, נשימה ושירה נכונה; עבודה על רפרטואר מגוון של שירים ישראליים וסגנונות נוספים; תרגול שירה קבוצתית והרמוניה; פיתוח נוכחות בימתית; הופעות בטקסים ובאירועים חברתיים ותרבותיים; וטיפוח עבודת צוות ואחריות משותפת."],["מבנה הפעילות","החזרות מתקיימות לאורך שנת הלימודים, לעיתים בשעות הלימודים ולעיתים לאחריהן, ובמידת הצורך גם במהלך חופשות. חבורת הזמר מייצגת את בית הספר באירועים חברתיים ותרבותיים ומעלה מדי שנה מופע סביב יוצר או נושא משמעותי. מועדי החזרות וההופעות נקבעים בבית הספר."],["למי זה מתאים?","לתלמידים שאוהבים לשיר, בעלי חוש מוזיקלי, רצון להתפתח, התמדה ונכונות לעבוד כחלק מהרכב. תנאי ההצטרפות ומבחני התאמה, אם מתקיימים, נקבעים בבית הספר."],["מה מרוויחים?","כישורים מוזיקליים וקוליים, ביטחון עצמי, יכולת ביטוי אישי, עבודת צוות, עמידה בפני קהל וחוויית שייכות ושותפות ביצירה."],["המסר המוביל","לכל אחד קול משלו. יחד יוצרים הרמוניה."]]},
 P019:{"lead":"חידון התנ״ך – מסע של ידע, מורשת ומצוינות","sections":[["על התוכנית","חידון התנ״ך לנוער הוא מפעל חינוכי ארצי של משרד החינוך המעודד בני נוער להעמיק בלימוד התנ״ך, להכיר את הסיפורים, הדמויות והאירועים המכוננים שבו ולחזק את הקשר למורשת ולתרבות הישראלית. הוא משלב לימוד עצמאי וקבוצתי עם התמודדות בשלבי תחרות."],["מה לומדים ועושים?","בקיאות בספרי התורה, הנביאים והכתובים בהתאם לחומר השנתי; לימוד דמויות, רצף אירועים והקשרים בין פרקים; הבנת הסיפורים ומסריהם; פיתוח זיכרון, שליפת מידע ולמידה עצמאית; ותרגול שאלונים וחידונים משנים קודמות."],["מבנה התוכנית ושלבי החידון","ההכנה יכולה להתחיל בבית הספר, ובהמשך מתקיימים שלבי חידון מחוזיים וארציים. הנציגים הנבחרים עשויים להתקדם לחידון התנ״ך העולמי לנוער הנערך ביום העצמאות. מתכונת השלבים, חומר הלימוד וספי ההעפלה נקבעים מדי שנה על ידי משרד החינוך."],["למי זה מתאים?","לתלמידי כיתות י׳–י״ב האוהבים תנ״ך ומורשת, בעלי סקרנות, זיכרון טוב, יכולת למידה עצמאית ונכונות להשקיע בהכנה ממושכת. אין צורך בהצטיינות בכל מקצועות הלימוד."],["מה מרוויחים?","העמקת הידע בתנ״ך ובמורשת ישראל, פיתוח משמעת עצמית, מיומנויות למידה ועמידה באתגר, תחושת מסוגלות והזדמנות לייצג את בית הספר."],["מידע והרשמה","ההרשמה וההכנה מתבצעות דרך בית הספר בהתאם להנחיות משרד החינוך. פרטים וחומרי לימוד באתר הרשמי: https://www.gov.il/he/departments/topics/bible-quiz"]]},
 P021:{"lead":"צופן תרבות – כשהעבר פוגש את המדע","sections":[["על המגמה","צופן תרבות היא תוכנית לימודים ייחודית לבגרות בארכאולוגיה ומדעים בהיקף 5 יחידות לימוד, שפותחה במוזיאון לתרבות הפלשתים ע״ש קורין ממן באשדוד ואושרה על ידי משרד החינוך. היא מפגישה בין מדעי הרוח, מדעי הטבע והמחקר הארכאולוגי."],["מה לומדים ועושים?","ארכאולוגיה ותרבויות עתיקות; שימוש בכימיה, ביולוגיה ומדעי הסביבה לניתוח ממצאים; התנסות בחפירות, תיעוד, מיון ועיבוד ממצאים; בדיקות ומחקר במעבדות; וחקר המורשת של אשדוד, לרבות אשדוד־ים והמצודה העתיקה."],["מבנה הלימודים","מסלול תלת־שנתי לכיתות י׳–י״ב, בהיקף של 5 יח״ל לבגרות. הלמידה משלבת את המוזיאון לתרבות הפלשתים, מעבדות מקיף ג׳ אשדוד, אתרים ארכאולוגיים ומפגשים עם חוקרים ומומחים."],["למי זה מתאים?","לתלמידי החטיבה העליונה באשדוד בעלי סקרנות, עניין בהיסטוריה, במדע ובתרבויות עתיקות, המעוניינים לשלב למידה עיונית עם חקר והתנסות מעשית."],["מה מרוויחים?","בגרות בהיקף 5 יח״ל בארכאולוגיה ומדעים, התנסות במחקר, מיומנויות חקר מדעי, חשיבה ביקורתית, עבודת צוות והיכרות עם ההיסטוריה של אשדוד."],["מידע והרשמה","התוכנית הוצגה כמגמה על־אזורית. מתכונת הפעילות, ההרשמה ומספר המקומות לשנת תשפ״ז דורשים אישור עדכני. תוכנית משרד החינוך: https://meyda.education.gov.il/files/Mazkirut_Pedagogit%5CTochniyotYichudiyot/archeologyandscience_culturecode_2021.pdf"]]},
 P022:{"lead":"מש״צים – מובילי של״ח צעירים | לומדים להוביל בדרך","sections":[["על התוכנית","תוכנית המש״צים היא מסגרת ארצית של אגף של״ח וידיעת הארץ במשרד החינוך, המכשירה בני נוער לתפקידי מנהיגות, הדרכה וארגון פעילויות שטח. המש״צים פועלים לצד מורי השל״ח, מסייעים בארגון סיורים וטיולים, מדריכים תלמידים צעירים ומשמשים כוח מוביל בפעילויות ערכיות וחברתיות."],["מה לומדים ועושים?","מנהיגות והדרכה: עמידה בפני קהל, בניית פעילות והובלת קבוצה; ידיעת הארץ: נופים, מסלולים ואתרי מורשת; מיומנויות שדה: התמצאות, ניווט ותכנון מסלול; עבודת צוות; סיוע בארגון טיולים, ימי שדה ומסעות; ופעילויות מעורבות חברתית למען בית הספר והקהילה."],["מבנה התוכנית","ההכשרה מתחילה לרוב בשלב פרחי מש״צים בחטיבת הביניים ומשלבת מפגשים במהלך השנה, התנסות בשטח ומחנה קיץ להכשרה מרוכזת. תלמידים שסיימו את ההכשרה יכולים להמשיך לפעול כמש״צים, להתנסות בהדרכה ולצאת להכשרות המשך. מתכונת ההכשרה המדויקת נקבעת לפי בית הספר והמחוז."],["למי זה מתאים?","לתלמידים האוהבים טיולים וטבע, בעלי אחריות, יוזמה ויכולת לעבוד בצוות, המעוניינים להדריך ולהוביל ומוכנים להשקיע בהכשרה לאורך זמן. ההצטרפות כפופה לנהלי הבחירה וההכשרה."],["מה מרוויחים?","התנסות במנהיגות והדרכה, מיומנויות ניווט ושטח, היכרות מעמיקה עם הארץ, פיתוח ביטחון עצמי, עבודת צוות, אחריות ותחושת שייכות לקבוצת מנהיגות צעירה."],["המסר המוביל","לא רק הולכים בדרך – לומדים להוביל אחרים."]]},
 P023:{"lead":"Name Your Hero – בוחרים גיבור, מספרים סיפור, מעוררים השראה","sections":[["על התחרות","תחרות החיבורים הארצית Name Your Hero מתקיימת על ידי אוניברסיטת תל אביב לנוער בשיתוף פרס דן דוד. המשתתפים בוחרים אדם, ארגון או מוסד שתרמו תרומה משמעותית לחברה או לאנושות, חוקרים את פועלם ומציגים בחיבור מקורי ומנומק מדוע הם ראויים להכרה."],["מה עושים בתחרות?","בוחרים דמות או ארגון מעוררי השראה; מאתרים מקורות מידע; מפתחים עמדה וטיעון מנומקים; כותבים חיבור מקורי הנשען על ראיות; ובשלבים המתקדמים משתתפים בסדנאות כתיבה ובליווי אקדמי."],["שלבי התחרות בתשפ״ז (2026–2027)","שלב ההצעות: הגשת חיבור קצר עד עמוד אחד בין 1.11.2026 ל־15.1.2027. סדנת כתיבה למעפילים: 22.2.2027; הגשת חיבור מורחב עד 15.3.2027. מרתון כתיבה: 11.4.2027; הגשה סופית עד 18.4.2027. שלב הגמר וטקס הפרסים צפויים באמצע יוני 2027. יש להתעדכן באתר התחרות לגבי שינויים."],["למי זה מתאים?","לתלמידי כיתות ט׳–י״ב בעלי סקרנות, כושר ביטוי בכתב, יכולת מחקר ורצון להביע עמדה אישית. אין הכרח בניסיון קודם בכתיבה תחרותית."],["מה מרוויחים?","פיתוח כתיבה עיונית וטיעונית, חקר עצמאי, חשיבה ביקורתית, היכרות עם דמויות מעוררות השראה ואפשרות לקבל משוב וליווי אקדמי ולהתמודד על פרסים."],["מידע והרשמה","ההרשמה למחזור תשפ״ז צפויה להיפתח ב־1 בנובמבר 2026. המועד האחרון להגשת ההצעה הוא 15 בינואר 2027. אתר התחרות: https://noar.tau.ac.il/dan-david-competition"]]},
 P024:{"lead":"כימיאדה – לחשוב כמו כימאים, לחקור כמו מדענים","sections":[["על התחרות","הכימיאדה היא האולימפיאדה הארצית בכימיה המתקיימת בפקולטה לכימיה ע״ש שוליך בטכניון. היא מעודדת העמקה מעבר לתוכנית הלימודים ומשמשת גם מסלול איתור ומיון לנבחרת ישראל בכימיה לקראת אולימפיאדות בינלאומיות."],["מה לומדים ועושים?","מעמיקים במבנה האטום, קשרים כימיים, תגובות, חישובים סטוכיומטריים, תמיסות ונושאים מתקדמים בהתאם לחומר התחרות; מנתחים בעיות מדעיות, מפרשים ניסויים ונתונים, מתרגלים שאלות מאתגרות ולומדים באופן עצמאי."],["מבנה התחרות","שלב א׳: מיון מקוון, במתכונת האחרונה באמצעות מחשבי בתי הספר. שלב ב׳: מבחן ארצי פרונטלי למעפילים. שלב ג׳: גמר הכימיאדה בטכניון, הכולל מבחנים מתקדמים ומשמש גם לאיתור מועמדים לנבחרת ישראל בכימיה. המועדים והנהלים עשויים להשתנות בשנת תשפ״ז."],["למי זה מתאים?","לתלמידי כיתות ט׳–י״א בעלי סקרנות מדעית, חשיבה אנליטית, אהבה לפתרון בעיות ונכונות ללמוד כימיה ברמה מאתגרת. ניתן להשתתף גם לפני בחירת מגמת כימיה, בהתאם לנהלי התחרות."],["מה מרוויחים?","העמקת ידע בכימיה, פיתוח פתרון בעיות וחשיבה מדעית, התנסות בתחרות ארצית, חשיפה לטכניון ולמחקר אקדמי ואפשרות להתקדם למיוני נבחרת ישראל ולאולימפיאדות בינלאומיות."],["מידע והרשמה","פרטי הרישום, המועדים וההטבות נקבעים מדי שנה. אתר הכימיאדה: https://chemiada.twix.technion.ac.il/ | נבחרת ישראל בכימיה: https://pop.education.gov.il/olimpiadot-madaim/chemia/"]]},
 P025:{"lead":"תחרות הכספות בפיזיקה – כשהידע הופך להמצאה","sections":[["על התחרות","טורניר הכספות הוא פרויקט מדעי־טכנולוגי ארצי לתלמידי פיזיקה, שבו כל צוות מפתח כספת בעלת מנגנוני נעילה המבוססים על עקרונות פיזיקליים. צוותים אחרים נדרשים לזהות את התופעות ולפתור את החידות כדי לפתוח את הכספת."],["מה עושים בתוכנית?","מעלים רעיונות ומתכננים מנגנוני נעילה; מבצעים ניסויים ובדיקות היתכנות; מתכננים ובונים אבטיפוס וכספת סופית; משפרים את העיצוב ואת חוויית הפיצוח; מתעדים את התהליך ומציגים את התוצר; ומתמודדים ביום התחרות עם כספות של צוותים אחרים."],["מבנה התחרות","צוותים של 4–5 תלמידי כיתה י״ב הלומדים פיזיקה ברמת 5 יח״ל, בליווי מורה לפיזיקה, מבצעים תהליך ממושך של תכנון, בנייה, ניסויים ותיעוד. בלוח הפעילות שפורסם לתשפ״ז נכללים מפגש פתיחה בספטמבר 2026, הגשת רעיונות באוקטובר, פיתוח כספות בהמשך השנה וטורניר ב־14.4.2027 במרכז שוורץ/רייסמן ברחובות. יש לבדוק שהמועדים והמסלול תואמים להרשמת בית הספר."],["יתרון משמעותי – חלופה לבגרות במעבדה בפיזיקה","לפי תקנון הטורניר, השתתפות מלאה מאפשרת קבלת ציון חלופי בבגרות החיצונית במעבדה בפיזיקה ללא הבחינה הרגילה: 67% מהצוותים המדורגים ראשונים מקבלים 100, ו־33% מהצוותים הנותרים מקבלים 90. תלמידים שקיבלו 90 יכולים לבחור להיבחן בבחינת המעבדה הרגילה בכפוף לנוהל. הזכאות מותנית בעמידה מלאה בדרישות התקנון המעודכן."],["למי זה מתאים?","לתלמידי כיתה י״ב הלומדים פיזיקה בהיקף 5 יח״ל, בעלי חשיבה מדעית, סקרנות הנדסית, יצירתיות ויכולת עבודת צוות, המוכנים להשקיע בפרויקט ארוך טווח."],["מה מרוויחים?","התנסות בתהליך הנדסי־מדעי מלא, פתרון בעיות, עבודת צוות, יצירתיות, ניהול פרויקט, יישום ידע פיזיקלי ואפשרות לציון חלופי בבגרות במעבדה."],["מידע נוסף","הנחיות משרד החינוך: https://ptc.weizmann.ac.il/?CategoryID=2216 | מידע על הטורניר: https://wise.org.il/special-projects/safe-tournament/"]]},
 P026:{"lead":"ביקור לימודי במרכז למחקר גרעיני שורק – מהתיאוריה למחקר","sections":[["על הביקור","הביקור במרכז למחקר גרעיני שורק מאפשר לתלמידי מגמת הפיזיקה להכיר את עולם המחקר המדעי המתקדם, להבין כיצד עקרונות הנלמדים בכיתה מיושמים במעבדות ובתעשייה ולהיחשף לאפשרויות המשך במדע, בהנדסה ובטכנולוגיה."],["נושאי הלמידה והחשיפה","פיזיקה גרעינית: מבנה הגרעין, רדיואקטיביות ותהליכים גרעיניים; קרינה ויישומיה: סוגי קרינה, מדידה ומיגון ושימושים ברפואה ובתעשייה; היכרות עם מחקר מתקדם, שיטות מחקר ומכשור מדעי; יישומים הנדסיים וטכנולוגיים; והיכרות עם עבודת חוקרים. התכנים שיוצגו בפועל נקבעים עם המרכז."],["מבנה הפעילות","הפעילות מתקיימת במסגרת ביקור לימודי במרכז למחקר גרעיני שורק, המאפשר לתלמידי מגמת הפיזיקה להיחשף למחקר מדעי מתקדם, ליישומים של פיזיקה גרעינית ולעבודתם של חוקרים. תוכן הביקור, מועדו ותדירותו נקבעים בהתאם לתיאום בין בית הספר למרכז."],["למי זה מתאים?","לתלמידי החטיבה העליונה הלומדים במגמת פיזיקה ומתעניינים במחקר, בתהליכים גרעיניים ובטכנולוגיות מתקדמות."],["מה מרוויחים?","העמקת ההבנה של יישומי הפיזיקה, הרחבת אופקים, חשיפה למחקר מתקדם וחיבור בין הידע העיוני להזדמנויות עתידיות באקדמיה ובתעשייה."],["המסר המוביל","הפיזיקה לא נשארת בספרים – היא פותחת דלת לעולם המחקר."]]},
 P027:{"lead":"אולימפיאדת החקר בביולוגיה – מהידע בכיתה לחשיבה מדעית","sections":[["על התחרות","אולימפיאדת החקר בביולוגיה היא תחרות ארצית ביוזמת הפיקוח על הוראת הביולוגיה במשרד החינוך ובשיתוף אוניברסיטת בר־אילן. התחרות מתקיימת מאז שנת 1998 ומקדמת מצוינות בלימודי ביולוגיה ומיומנויות חקר וחשיבה עצמאית."],["מה לומדים ועושים?","העמקה בתהליכים ביולוגיים ובמערכות חיים; ניתוח קטעי מחקר, שאלות מחקר, שיטות ותוצאות; פירוש גרפים וטבלאות והסקת מסקנות; בחינת השערות ומשתנים וחשיבה ביקורתית; ויישום ידע במצבים מדעיים חדשים."],["מבנה התחרות","התחרות משלבת שלבי מיון והערכה של ידע ביולוגי ומיומנויות חקר, ובהמשך התמודדות של תלמידים נבחרים במסגרת ארצית. לשנת תשפ״ז פורסם חוזר האולימפיאדה ה־30. מועדים ודרישות מחייבות נקבעים בחוזר השנתי של משרד החינוך."],["למי זה מתאים?","לתלמידי החטיבה העליונה הלומדים ביולוגיה, בעלי סקרנות, חשיבה אנליטית, יכולת לפרש נתונים מדעיים ונכונות להתמודד עם שאלות מורכבות."],["מה מרוויחים?","העמקת ידע ביולוגי, מיומנויות חקר, ניסיון בניתוח מחקרים מדעיים, פיתוח חשיבה ביקורתית והזדמנות לייצג את בית הספר ולהצטיין ברמה הארצית."],["המסר המוביל","לא רק לדעת ביולוגיה – ללמוד לחשוב כמו מדענים."],["מידע נוסף","אולימפיאדת החקר בביולוגיה – משרד החינוך: https://pop.education.gov.il/tchumey_daat/biologya/chativa-elyona/biology-pedagogy/projects/"]]},
 P028:{"lead":"האולימפיאדה בביוטכנולוגיה – חוקרים, מגלים, מציגים","sections":[["על האולימפיאדה","האולימפיאדה הארצית בביוטכנולוגיה מתקיימת ביוזמת הפיקוח על הוראת הביוטכנולוגיה במשרד החינוך ובשיתוף הטכניון. זו תחרות המבוססת על עבודות הגמר המחקריות שביצעו תלמידי כיתה י״ב במסגרת לימודי ״יישומים בביוטכנולוגיה״ בהיקף 5 יחידות לימוד. התלמידים מציגים את מחקריהם בפני חוקרים ואנשי אקדמיה ומדגימים את הידע, המיומנויות והניסיון המחקרי שצברו."],["מה עושים בתחרות?","מבצעים מחקר יישומי במעבדת מחקר; מעבדים תוצאות ומסיקים מסקנות; כותבים עבודה מדעית; מכינים כרזה המציגה שאלת מחקר, שיטות, תוצאות ומסקנות; מציגים את המחקר בעל פה ומגינים עליו בפני ועדת שיפוט; ונחשפים למחקרים ולחוקרים בטכניון."],["שלבי האולימפיאדה בתשפ״ז (2026–2027)","עד 15 בדצמבר 2026 – הגשת כרזה מדעית; 21–23 בדצמבר 2026 – חצי גמר והצגת הכרזה; עד 17 בינואר 2027 – הגשת עבודות החקר; 27 בינואר 2027 – הצגת עבודות מועמדים בפני ועדת השיפוט; 31 בינואר 2027 – אירוע הגמר בטכניון. המועדים כפופים לעדכוני המארגנים."],["למי זה מתאים?","לתלמידי כיתה י״ב במגמת ביוטכנולוגיה המבצעים עבודת גמר ביישומים בביוטכנולוגיה בהיקף 5 יח״ל, בעלי הבנה מעמיקה של מחקרם, יכולת ניתוח והצגה מדעית ומוטיבציה למצוינות."],["מה מרוויחים?","פיתוח מיומנויות מחקר, עיבוד נתונים, כתיבה והצגת מחקר, ניסיון בהגנה על עבודה בפני ועדה מקצועית, חשיפה לאקדמיה והזדמנות להצטיינות ארצית."],["פרסים והטבות למצטיינים","האולימפיאדה מעניקה לתלמידים המצטיינים הזדמנות לזכות בפרסים ובהכרה אקדמית. הזוכים בשלושת המקומות הראשונים זכאים למלגות לימודים בטכניון. נוסף על כך, קיימות הטבות בהערכת עבודת הגמר ב״יישומים בביוטכנולוגיה״, בהתאם להישגים בתחרות ולתקנון השנתי. תנאי הזכאות המדויקים להטבות בציון טעונים אימות."],["מידע נוסף","האולימפיאדה בביוטכנולוגיה – משרד החינוך: https://pop.education.gov.il/tchumey_daat/biotechnology/high-school/pedagogy/biotech-olympic/"]]},
 P029:{"lead":"אולימפיאדת הפיזיקה – לחשוב מעבר לנוסחאות","sections":[["על התחרות","האולימפיאדה הלאומית בפיזיקה היא מסלול איתור ומיון לנבחרת ישראל במסגרת מערך נבחרות ישראל במדעים של משרד החינוך ומרכז מדעני העתיד. האימונים האקדמיים של הנבחרת מתקיימים במרכז חוסידמן באוניברסיטת בן־גוריון בנגב. המצטיינים עשויים לייצג את ישראל באולימפיאדה הבין־לאומית בפיזיקה."],["מה לומדים ועושים?","מעמיקים במכניקה, תנועה, כוחות, אנרגיה וחוקי שימור; פותרים בעיות פיזיקליות לא שגרתיות; משתמשים בכלים מתמטיים לניתוח תופעות; מתרגלים שאלות ממבחני עבר. למתקבלים לנבחרת ניתנת הכשרה מדעית מתקדמת הכוללת גם התנסויות מעבדתיות."],["מבנה התחרות","שלב א׳ – מבחן מיון מקוון ארצי במחשבי בתי הספר; שלב ב׳ – מבחן מיון פרונטלי במוקדים ברחבי הארץ; שלב ג׳ – מיון מתקדם באוניברסיטת בן־גוריון; ובהמשך הכשרה בנבחרת ישראל למתקבלים. מתכונת השלבים ומועדי הבחינות כפופים להנחיות המחזור השנתי."],["למי זה מתאים?","לתלמידי כיתות ט׳–י״א בעלי עניין עמוק בפיזיקה ובמתמטיקה, חשיבה אנליטית ויצירתית, יכולת למידה עצמאית ומוטיבציה לאתגרים מתקדמים. השתתפות במיון הראשוני אינה מחייבת בהכרח בחירה מוקדמת במגמת פיזיקה, בכפוף לכללי המחזור."],["מה מרוויחים?","פיתוח חשיבה פיזיקלית ומתמטית, יכולות פתרון בעיות, התמדה ולמידה עצמאית; התנסות בתחרות ארצית והזדמנות להתקבל לנבחרת ישראל ולהשתתף בהכשרה אקדמית ובתחרויות בין־לאומיות."],["מידע והרשמה","תהליכי המיון וההכשרה בנבחרת מתקיימים ללא תשלום על פי הפרסום הרשמי. יש להתעדכן במועדי תשפ״ז באתר משרד החינוך: https://pop.education.gov.il/olimpiadot-madaim/physica/"]]},
 P033:{"lead":"מגמת המחול העל־אזורית – יוצרים, חוקרים ומביעים את עצמנו בתנועה","sections":[["על המגמה","מגמת המחול העל־אזורית פועלת במקיף ז׳ אשדוד ומיועדת לתלמידות ולתלמידים מרחבי העיר לאורך הרצף מכיתה ז׳ ועד כיתה י״ב. המסלול משלב התמחות מעשית ואמנותית במחול עם לימוד עיוני, יצירה, חקר ופיתוח שפה תנועתית אישית."],["מה לומדים ועושים?","לימודי בלט קלאסי ומחול מודרני; פיתוח טכניקה, יציבה, גמישות, כוח וקואורדינציה; קומפוזיציה וכוריאוגרפיה; עבודה עם מוזיקה, בניית רפרטואר והופעות בטקסים ובאירועים בית־ספריים ועירוניים; לצד העמקה בהיבטים עיוניים של עולם המחול."],["מסלול הלימודים והכרה בבגרות","המגמה מלווה תלמידים מכיתה ז׳ ועד י״ב. לפי אתר מקיף ז׳, בחטיבה העליונה ניתן לקבל הכרה בתעודת הבגרות של עד 10 יחידות לימוד במחול; נוסף על כך, למעוניינים קיימת אפשרות למסלול תעודה מקצועית של ״מדריך מחול״. היקף הלימודים המדויק ותנאי הזכאות תלויים במסלול ובדרישות המעודכנות."],["למי זה מתאים?","לתלמידות ולתלמידים מרחבי אשדוד בעלי רקע מוכח בלימודי מחול, אהבה לתנועה ונכונות להשקעה והתמדה במסגרת לימודים בהיקף משמעותי. תנאי הקבלה וההרשמה נקבעים על ידי המגמה ובית הספר."],["מה מרוויחים?","התקדמות אמנותית וטכנית, ביטוי עצמי וביטחון בהופעה, יכולת ליצור כוריאוגרפיה עצמאית, התנסות בהפקות ובמופעים, הכרה בבגרות ואפשרות להמשך לימודים או הכשרה מקצועית במחול."],["מידע נוסף","עמוד מגמת המחול באתר מקיף ז׳: https://www.makifz.com/מחול"]]},
 P030:{"lead":"תוכנית מצוינות בכדורסל – מצוינות על הפרקט, מנהיגות בחיים","sections":[["על התוכנית","תוכנית המצוינות בכדורסל של מקיף ז׳ אשדוד היא מסלול חינוכי־ספורטיבי שש־שנתי, מכיתה ז׳ ועד י״ב. התוכנית משלבת פיתוח יכולות ספורטיביות עם טיפוח מנהיגות, חוסן אישי, אחריות חברתית ושאיפה למצוינות. מצוינות נמדדת לא רק בהישגים על המגרש, אלא גם בדרך שבה מתמודדים עם אתגרים, עובדים בצוות ותורמים לקהילה."],["מצוינות ספורטיבית","אימוני כדורסל, שיפור יכולות אישיות וקבוצתיות, פיתוח כושר גופני וטקטיקה, השתתפות במשחקים ובתחרויות וייצוג בית הספר. נבחרת מקיף ז׳ העפילה היסטורית לליגת העל בכדורסל לתיכונים."],["העשרה והרחבת אופקים","התלמידים משתתפים בתוכניות העשרה מגוונות החושפות אותם לתכנים, לחוויות ולתחומי עניין נוספים מעבר לעולם הספורט, כחלק מהצמיחה האישית לאורך המסלול."],["מנהיגות והעצמה אישית","התוכנית מטפחת ביטחון עצמי, משמעת, חוסן מנטלי, יוזמה, אחריות, קבלת החלטות והתמודדות עם הצלחות וכישלונות. פעילויות המנהיגות וההעצמה הן חלק בלתי נפרד מהמסלול."],["מעורבות חברתית ותרומה לקהילה","התלמידים לוקחים חלק בפעילויות מעורבות חברתית, מפתחים ערבות הדדית ואחריות כלפי סביבתם ולומדים להשתמש בכוחו של הספורט כדי להוביל ולהשפיע לטובה."],["מבנה התוכנית","התוכנית פועלת מכיתה ז׳ ועד י״ב ומלווה את התלמידים בתהליך התפתחות הדרגתי. לצד אימונים ומשחקים מתקיימות תוכניות העשרה, פעילויות מנהיגות והעצמה ומעורבות חברתית."],["הישגים בולטים","בשנת 2025 רשמה נבחרת מקיף ז׳ העפלה היסטורית לליגת העל לתיכונים, לראשונה בתולדות אשדוד. בין הישגיה זכייה בטורניר כדורסל ארצי וניצחון 89:74 על הריאלי חיפה במשחק הבכורה בעונת 2025/26. משחקי הבית מתקיימים באולם ברובע הסיטי באשדוד."],["למי זה מתאים?","לתלמידי כיתות ז׳–י״ב בעלי כישרון ועניין בכדורסל, מוטיבציה להתאמן ולהתקדם, מחויבות לעבודה קבוצתית ורצון לקחת חלק במסגרת המשלבת מצוינות ספורטיבית עם צמיחה אישית וחברתית."],["מה מרוויחים?","פיתוח יכולות ספורטיביות לצד משמעת עצמית, חוסן מנטלי, ביטחון עצמי, עבודת צוות, תחושת שייכות, אחריות וכישורי מנהיגות ותרומה לקהילה."],["המסר המוביל","מגדלים שחקנים מצטיינים. מצמיחים אנשים מובילים."]]},
 P032:{"lead":"נבחרת האתלטיקה הקלה – רצים קדימה, שוברים שיאים","sections":[["על הנבחרת","נבחרות האתלטיקה הקלה של מקיף ז׳ אשדוד מעודדות תלמידות ותלמידים למצות את יכולותיהם בענפי האתלטיקה, להציב מטרות אישיות ולהתקדם באמצעות אימון, נחישות והתמדה. הנבחרות מייצגות את בית הספר בתחרויות ומהוות מוקד לגאווה קהילתית."],["מה עושים בנבחרת?","מקצועות הריצה – פיתוח מהירות, סבולת וטכניקה; מקצועות הקפיצה – שיפור כוח מתפרץ וקואורדינציה; מקצועות הזריקה – פיתוח כוח ושליטה בתנועה בהתאם לענפי הפעילות; אימונים לקראת תחרויות, פיתוח כושר גופני ושיפור תוצאות אישיות וקבוצתיות."],["הישגים שמדברים בעד עצמם","בשנים האחרונות רשמו נבחרות האתלטיקה של מקיף ז׳ אשדוד הישגים מרשימים באליפות מחוז הדרום, ובהם ארבע הופעות על הפודיום: מקום ראשון לבנים ולבנות בכיתה ט׳, מקום שני לבנים בכיתות ז׳–ח׳ ומקום שני לבנים בכיתות י׳–י״ב. ההישגים משקפים מצוינות ספורטיבית, התמדה, עבודת צוות וחתירה לשיפור מתמיד לאורך שכבות הגיל."],["מבנה הפעילות","הנבחרות משלבות אימונים והכנה להשתתפות בתחרויות אתלטיקה בית־ספריות, עירוניות ומחוזיות בהתאם למסגרת הפעילות. תדירות האימונים והמקצועות שבהם מתחרים נקבעים בבית הספר."],["למי זה מתאים?","לתלמידות ולתלמידים מחטיבת הביניים ומהחטיבה העליונה בעלי יכולת בענפי הריצה, הקפיצה או הזריקה, אוהבי פעילות גופנית, בעלי משמעת עצמית ונכונות להתאמן ולהשתפר."],["מה מרוויחים?","שיפור כושר גופני ומיומנויות אתלטיות, חיזוק ביטחון עצמי, פיתוח חוסן והתמדה, הצבת יעדים וגאווה בייצוג בית הספר."],["המסר המוביל","השיא הבא הוא לא רק בתוצאה – הוא בדרך שעושים כדי להגיע אליו."]]},
 P031:{"lead":"נבחרת הכדורגל – הרבה מעבר למשחק","sections":[["על הנבחרת","נבחרת הכדורגל של מקיף ז׳ אשדוד מטפחת מצוינות ספורטיבית לצד עבודת צוות, משמעת עצמית, נחישות, מנהיגות ואחריות. התלמידים מפתחים את יכולותיהם האישיות והקבוצתיות, מתנסים במשחק תחרותי ולומדים להתמודד עם הצלחות ואתגרים."],["פעילות הנבחרת","אימונים ופיתוח מיומנויות בכדורגל, שיפור הכושר הגופני, חשיבה טקטית, השתתפות במשחקים ובתחרויות וייצוג בית הספר."],["הישגים בולטים","בשנים האחרונות רשמה נבחרת הכדורגל של מקיף ז׳ הישגים בתחרויות הספורט לבתי הספר. אחד הבולטים שבהם הוא זכייה במקום השני באליפות מחוז הדרום לתלמידי כיתות י׳–י״ב והעפלה לאליפות הארצית בכדורגל. ההישג תועד בתחרות המחוזית בדצמבר 2022."],["למי זה מתאים?","לתלמידים בעלי יכולת בכדורגל, מחויבות לאימונים, יכולת לעבוד בצוות ורצון להתפתח ולייצג את בית הספר בתחרויות."],["מה מרוויחים?","פיתוח יכולות ספורטיביות, מנהיגות, התמדה, ביטחון עצמי, עבודת צוות, חוסן מנטלי וגאווה בייצוג בית הספר."],["המסר המוביל","משחקים כקבוצה. מצליחים ביחד."]]}

function programDetailedHtml(p){
 const detail=RICH_PROGRAM_DETAILS[p.id];
 if(!detail)return '<p>'+escapeHtml(p.desc)+'</p>';
 return '<p class="program-detail-lead">'+escapeHtml(detail.lead)+'</p>'+detail.sections.map(([title,content])=>'<section class="program-detail-section"><h3>'+escapeHtml(title)+'</h3><p>'+escapeHtml(content)+'</p></section>').join('');
}
function showProgram(i){let p=programDetails[i];if(!p)return;document.querySelector('#programDialog')?.remove();let div=document.createElement('div');div.id='programDialog';div.className='modal-shade';div.innerHTML='<section class="modal-panel" role="dialog" aria-modal="true" aria-label="'+escapeHtml(p.name)+'"><button class="modal-close" onclick="document.getElementById(\'programDialog\').remove()">✕</button><span class="category-caption">'+escapeHtml(p.category)+' · '+escapeHtml(p.scope)+'</span><h2>'+escapeHtml(p.name)+'</h2>'+programDetailedHtml(p)+'<h3>קהל יעד</h3><p>'+escapeHtml(p.audience)+'</p><button onclick="document.getElementById(\'programDialog\').remove()">סגירה</button></section>';div.onclick=e=>{if(e.target===div)div.remove()};document.body.append(div)}
function filterCatalog(value){window.rwCatalogSearch=value;const pos=document.activeElement?.selectionStart||value.length;catalog(false);const field=document.getElementById('catalogSearch');if(field){field.focus({preventScroll:true});field.setSelectionRange(pos,pos)}}
function catalog(resetScroll=true){const search=window.rwCatalogSearch||'',filter=window.rwCatalogFilter||'הכול';let list=programDetails.map((p,i)=>({...p,i})).filter(p=>(filter==='הכול'||p.category===filter)&&(!search||[p.name,p.desc,p.audience,p.category].some(t=>t.includes(search))));view('<div class="shell catalogue"><div class="catalogue-heading"><span class="eyebrow">מפת ההזדמנויות</span><h2>לכל סקרנות יש מסלול</h2><p>מגוון מסלולים והזדמנויות לצמיחה, למצוינות, ליצירה, לחקר, למנהיגות ולהתפתחות אישית.</p></div><div class="catalogue-controls"><label class="search-label" for="catalogSearch">מחפשים הזדמנות מסוימת?</label><div class="search-field"><span class="search-icon" aria-hidden="true">⌕</span><input id="catalogSearch" type="search" autocomplete="off" placeholder="שם תוכנית, תחום עניין או מילת מפתח..." value="'+escapeHtml(search)+'" oninput="filterCatalog(this.value)"></div><div class="filter-row">'+['הכול','מדע וטכנולוגיה','חברה ורוח','חברה ומנהיגות','אמנות ויצירה','ספורט ואתגר','מצוינות אישית'].map(v=>'<button class="filter-btn '+(filter===v?'active':'')+'" onclick="window.rwCatalogFilter=\''+v+'\';catalog()">'+v+'</button>').join('')+'</div></div><p class="catalog-count">'+list.length+' תוכניות בתצוגה</p><div class="program-grid">'+list.map(p=>programCard(p,p.i)).join('')+'</div><p class="notice-soft">מידע התוכניות מבוסס על התכנים שאושרו; תנאי קבלה, זמינות ומועדי הרשמה יאומתו מול הגורמים המפעילים.</p></div>')}
const ABOUT_CHAPTERS=[
{title:'כל תלמיד הוא סיפור של צמיחה',sub:'לגלות את מה שיש בי. להצמיח את מה שעוד יכול להיות.',text:['במקיף ז׳ אשדוד אנו מאמינים כי בכל תלמיד ותלמידה טמון עולם של יכולות, כישרונות, תחומי עניין ואפשרויות. חלקם כבר באים לידי ביטוי, אחרים ממתינים להזדמנות להתגלות, ויש כאלה שעוד יצמחו ויתפתחו לאורך הדרך.','התלמיד שנכנס בשערי בית הספר בכיתה ז׳ אינו אותו תלמיד שייצא מהם בסיום כיתה י״ב. במהלך שש שנות הלימוד הוא מתנסה, מגלה, משתנה, רוכש מיומנויות, מתמודד עם אתגרים ומפתח את זהותו האישית.'],img:'about-strip-1.png'},
{title:'לגדול, להשתנות ולגלות את עצמי מחדש',sub:'היכולות שלנו ממשיכות להתפתח.',text:['חלק מהכישרונות שלנו כבר באים לידי ביטוי. אחרים ממתינים להזדמנות להתגלות — ויש יכולות שעוד יצמחו לאורך הדרך.','בכל שנה, בכל מפגש ובכל התנסות אפשר לגלות משהו חדש על עצמנו. התלמידים אינם מוגדרים רק על ידי מה שהם יודעים לעשות היום.','מה מסקרן אותי? במה עוד הייתי רוצה להתנסות?'],img:'about-strip-2.png'},
{title:'מכיתה ז׳ עד י״ב — לא מפסיקים לגלות',sub:'שש שנים של התנסות, שינוי וצמיחה.',text:['התלמיד שנכנס בשערי בית הספר בכיתה ז׳ אינו אותו תלמיד שייצא מהם בסיום כיתה י״ב.','לאורך שש השנים הוא מתנסה, מגלה, משתנה, רוכש מיומנויות, מתמודד עם אתגרים ומפתח את זהותו האישית. כל שנה פותחת עוד אפשרות.'],img:'about-strip-3.png'},
{title:'מצוינות היא הרבה יותר מציונים',sub:'יש יותר מדרך אחת להצטיין.',text:['התפיסה החינוכית שלנו רואה בצמיחה האישית תהליך רב־ממדי, מתמשך והוליסטי.','מצוינות אינה נמדדת רק בהישגים לימודיים, אלא גם בסקרנות, ביצירתיות, בהתמדה, במנהיגות, בעשייה חברתית, בספורט, באמנות, בחשיבה ביקורתית ובאומץ להתנסות.','לא רק במה אני טוב היום — אלא גם מה עוד אוכל להיות.'],img:'about-strip-5.png'},
{title:'עולם של הזדמנויות, לא מסלול אחד',sub:'לגלות אפשרויות שלא הכרנו.',text:['בית הספר מציע מגוון תוכניות, מסלולי העשרה, תחרויות, יוזמות, נבחרות ומרחבי עשייה בתחומי המדעים, החברה והרוח, האמנות, הספורט והמנהיגות.','לא תמיד התלמידים והוריהם מכירים את כל האפשרויות. ״שורשים וכנפיים״ נולד כדי להפוך את ההזדמנויות לנגישות, מוכרות ואישיות — ולעודד גילוי של עולמות חדשים.'],img:'about-strip-6.png'},
{title:'שורשים שמעניקים ביטחון. כנפיים שפותחות אפשרויות.',sub:'המסע שלי. העתיד שלי.',text:['השורשים הם הזהות, הערכים, השייכות, החוזקות והבסיס שכל תלמיד בונה לאורך הדרך.','הכנפיים הן הסקרנות, ההתנסויות, המיומנויות החדשות, השאיפות והאומץ לצאת אל מעבר למוכר.','בין השורשים לכנפיים מתרחש מסע הצמיחה האישי של כל תלמיד ותלמידה.'],img:'about-strip-4.png'}
];
function aboutStory(){
const sections=[
['כל תלמיד הוא סיפור של צמיחה','לגלות את מה שיש בי. להצמיח את מה שעוד יכול להיות.',['במקיף ז׳ אשדוד אנו מאמינים כי בכל תלמיד ותלמידה טמון עולם של יכולות, כישרונות, תחומי עניין ואפשרויות. חלקם כבר באים לידי ביטוי, אחרים ממתינים להזדמנות להתגלות, ויש כאלה שעוד יצמחו ויתפתחו לאורך הדרך.','התלמיד שנכנס בשערי בית הספר בכיתה ז׳ אינו אותו תלמיד שייצא מהם בסיום כיתה י״ב. במהלך שש שנות הלימוד הוא מתנסה, מגלה, משתנה, רוכש מיומנויות, מתמודד עם <br class="ap-principle-linebreak">אתגרים ומפתח את זהותו האישית.']],
['לגדול, להשתנות ולגלות את עצמי מחדש','היכולות שלנו ממשיכות להתפתח.',['בכל שנה נפתחות בפני התלמידים אפשרויות חדשות, ובכל התנסות עשויה להתגלות יכולת שלא הכירו בעצמם.','לכל תלמיד יש חוזקות, אך החוזקות אינן קבועות ואינן מגדירות את גבולות יכולותיו. אפשר להעמיק את מה שכבר קיים, לרכוש כישורים חדשים, לפתח תחומי עניין שלא הכרנו ולגלות בעצמנו צדדים נוספים.']],
['מכיתה ז׳ עד י״ב — לא מפסיקים לגלות','שש שנים של גילוי, התנסות וצמיחה.',['לאורך שנות הלימוד משתנים תחומי העניין, מתפתחות מיומנויות ונבנית הזהות האישית. בכל שנה נפתחות דלתות חדשות ללמידה, לאחריות, ליוזמה ולהיכרות עם יכולות שעדיין לא הכרנו.']],
['מצוינות היא הרבה יותר מציונים','יש יותר מדרך אחת להצטיין.',['התפיסה החינוכית שלנו רואה בצמיחה האישית תהליך רב־ממדי, מתמשך והוליסטי.','מצוינות אינה נמדדת רק בהישגים לימודיים, אלא גם בסקרנות, ביצירתיות, בהתמדה, במנהיגות, בעשייה חברתית, בספורט, באמנות, בחשיבה ביקורתית, ביוזמה ובאומץ להתנסות בדברים חדשים.']],
['עולם של הזדמנויות, לא מסלול אחד','ההזדמנות המתאימה עשויה להיות קרובה משחשבנו.',['בית הספר מציע תוכניות, מסלולי העשרה, תחרויות, יוזמות, נבחרות ומרחבי עשייה במדעים, בטכנולוגיה, בחברה וברוח, באמנות, בספורט ובמנהיגות.','״שורשים וכנפיים״ נולד כדי להפוך את האפשרויות לנגישות, מוכרות ואישיות — ולעודד בחירה מתוך סקרנות.']],
['שורשים שמעניקים ביטחון. כנפיים שפותחות אפשרויות.','המסע שלי. העתיד שלי.',['השורשים הם הזהות, הערכים, השייכות, החוזקות והבסיס שכל תלמיד בונה לאורך הדרך. הכנפיים הן הסקרנות, ההתנסויות, השאיפות והאומץ לצאת מעבר למוכר.','תפקידנו אינו רק לעזור לתלמידים להגיע להישגים, אלא לאפשר להם לגלות דרכים שונות לצמוח, להתפתח ולהגשים את עצמם.']]
];
const chapters=sections.map((x,i)=>'<article class="ap-chapter"><div class="ap-index">'+String(i+1).padStart(2,'0')+'</div><div class="ap-chapter-body"><h3>'+x[0]+'</h3><p class="ap-sub">'+x[1]+'</p><div class="ap-paras">'+'<p>'+x[2].join(' ')+'</p>'+'</div></div></article>').join('');
const stages=[['ז׳','היכרות'],['ח׳','גילוי'],['ט׳','התנסות'],['י׳','העמקה'],['י״א','בחירה'],['י״ב','הגשמה']].map(x=>'<div class="ap-stage"><span class="ap-node"></span><strong>'+x[0]+'</strong><span>'+x[1]+'</span></div>').join('');
view('<div class="ap-about" dir="rtl"><div class="ap-about-image-banner"><img src="/hero-about.png" alt="אודות · שורשים וכנפיים" loading="eager"></div><section class="ap-intro ap-unified-intro ap-single-philosophy"><div class="ap-intro-title"><span class="ap-eyebrow">התפיסה החינוכית שלנו · העקרונות שמובילים אותנו</span><h2><span class="ap-about-heading-navy">שורשים שמעניקים ביטחון</span><span class="ap-about-heading-teal">וכנפיים שפותחות אפשרויות.</span></h2></div><div class="ap-philosophy-copy"><p>״שורשים וכנפיים״ מציע מסע התפתחותי שש־שנתי, המאפשר לכל תלמיד ותלמידה להעמיק את ההיכרות עם עצמם, לגלות חוזקות וכישרונות, להיחשף לעולמות תוכן חדשים ולהכיר מגוון אפיקי מצוינות והתפתחות.</p><p>באמצעות פלטפורמה דיגיטלית אישית, נפרש בפני כל תלמיד ותלמידה עולם של הזדמנויות בית־ספריות, עירוניות וארציות, המותאמות לשלב שבו הם נמצאים במסע. הפלטפורמה מנגישה תוכניות, מסלולי העשרה, יוזמות, תחרויות ומרחבי עשייה, ומאפשרת לגלות אפשרויות חדשות, להתנסות ולבחור מתוך תחומי העניין, החוזקות והשאיפות האישיות.</p><p>לאורך שש שנות הלימוד המסע מתחדש ומתפתח. בכל שנה נפתחים אופקים נוספים, מתגלות יכולות חדשות ומתרחבות האפשרויות לבחירה, להעמקה ולצמיחה. זהו מסע הנשען על שורשים של זהות, ערכים ושייכות, ומעניק כנפיים להעז, לחלום, ליזום ולמצוא את הדרך האישית להגשמה ולמשמעות.</p></div></section><section class="ap-story" id="about-principles"><div class="ap-story-heading"><h2><span class="ap-story-line-dark">לא רק לאן מגיעים.</span><span class="ap-story-line-turquoise">גם למי הופכים בדרך.</span></h2><p class="ap-section-intro">ששת העקרונות מבטאים את האמונה שלנו בכל תלמיד ותלמידה ואת הדרך שבה אנו רואים מצוינות, שייכות ואפשרויות לצמיחה.</p></div><div class="ap-carousel-controls"><span class="ap-carousel-counter" id="ap-carousel-count" aria-live="polite">01 / 06</span></div><div class="ap-carousel-stage"><div class="ap-chapters" id="ap-principles-carousel" role="region" aria-label="קרוסלת ששת העקרונות" tabindex="0">'+chapters+'</div><div class="ap-carousel-buttons"><button type="button" class="ap-carousel-btn ap-carousel-next" onclick="moveAboutCarousel(1)" aria-label="לעיקרון הבא"><svg class="ap-nav-arrow" viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="ap-carousel-btn ap-carousel-prev" onclick="moveAboutCarousel(-1)" aria-label="לעיקרון הקודם"><svg class="ap-nav-arrow" viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></section><div class="ap-next-page"><span>ממשיכים מהחזון אל המעשה</span><h2>איך נראית הצמיחה בפועל?</h2><p>בכל שנה התלמידים חוזרים למעגל של גילוי, חשיפה, התנסות, בחירה והשפעה.</p><a href="#development">למסע ההתפתחות ←</a></div><section class="ap-ending"><span class="ap-eyebrow">שורשים בלב. כנפיים לעתיד.</span><h2>המסע שלי. <em>העתיד שלי.</em></h2><p>לא רק מי אני היום — גם מי אני יכול להיות מחר.</p><a href="#start">מתחילים במסע <span aria-hidden="true">←</span></a></section></div>');
}
function developmentPage(){view('<div class="ap-about ap-development-page" dir="rtl"><header class="ap-development-intro"><span class="ap-eyebrow">שורשים וכנפיים · מסע ההתפתחות שלי</span><h1>בכל שנה <em>מגלים מחדש.</em></h1><p>מסע אישי שנפתח בכל שנת לימודים מחדש. ארבע שאלות שחוזרות ומעמיקות<br class="development-desktop-break">ככל שאנחנו גדלים, משתנים ומגלים אפשרויות חדשות.</p></header>'+'<section class="ap-journey ap-cycle-journey" id="about-journey"><div class="ap-development-layout"><div class="ap-development-cards"><div class="ap-cycle" aria-label="ארבע שאלות המסע החוזרות בכל שנה">'+[['01','מגלים','מי אני היום? אילו חוזקות ותחומי עניין חדשים גיליתי?'],['02','נחשפים','אילו אפשרויות ואפיקי מצוינות נפתחים בפניי?'],['03','מתנסים ובוחרים','במה ארצה להתנסות, להעמיק ולהתקדם השנה?'],['04','צומחים ומשפיעים','מה פיתחתי בעצמי, ולאן ארצה להגיע בהמשך?']].map((x,i)=>'<button type="button" class="ap-cycle-card" onclick="if(window.innerWidth<901)openJourneyStage('+i+')" aria-label="הרחבה: '+x[1]+'"><span class="ap-cycle-index">'+x[0]+'</span><span class="ap-cycle-card-title">'+x[1]+'</span><span class="ap-cycle-question">'+x[2]+'</span><span class="ap-cycle-full">'+journeyStageDetails[i].body.slice(x[2].length).trim()+'</span><span class="ap-cycle-open">לגלות עוד ←</span></button>').join('')+'</div></div><div class="ap-development-illustration"><picture><source media="(max-width: 900px)" srcset="/development-journey-spiral-mobile%20.png"><img src="/development-journey-spiral.png.png" alt="מסע גילוי וצמיחה ספירלי של תלמידים, מהיכרות אישית דרך התנסות והרחבת אופקים ועד לפריסת כנפיים" loading="eager"></picture></div></div><div class="ap-cycle-repeat"><span aria-hidden="true">↻</span> בכל שנה חוזרים אל אותן שאלות — ומגלים תשובות חדשות.</div></section>'+'<section class="ap-development-foot"><span class="ap-eyebrow">מכירים את הדרך שמאחורי המסע?</span><h2>שורשים עמוקים. כנפיים פתוחות.</h2><a href="#about">לתפיסה החינוכית שלנו ←</a><a href="#start">מתחילים במסע ←</a></section></div>');}
const journeyStageDetails=[
{grade:'01',title:'מגלים',body:'מי אני היום? אילו חוזקות ותחומי עניין חדשים גיליתי? בכל שנה אנחנו מתבוננים מחדש בעצמנו, מזהים יכולות, ערכים, כישרונות וסקרנויות שהתפתחו, ומרחיבים את ההיכרות עם מי שאנחנו.'},
{grade:'02',title:'נחשפים',body:'אילו אפשרויות ואפיקי מצוינות נפתחים בפניי? אנחנו מכירים הזדמנויות חדשות במדעים, בטכנולוגיה, בחברה וברוח, באמנות, בספורט ובמנהיגות — ומגלים אפשרויות שלא חשבנו עליהן קודם.'},
{grade:'03',title:'מתנסים ובוחרים',body:'במה ארצה להתנסות, להעמיק ולהתקדם השנה? מתוך סקרנות והיכרות עם האפשרויות, אנחנו מתנסים, בוחרים מטרות אישיות, מעמיקים ומאפשרים לעצמנו לשנות כיוון ולגלות יכולות נוספות.'},
{grade:'04',title:'צומחים ומשפיעים',body:'מה פיתחתי בעצמי, ולאן ארצה להגיע בהמשך? אנחנו מתבוננים בצמיחה שלנו, מזהים למידה, תרומה והשפעה, ומסמנים אופק חדש לשנה הבאה. כך מתחיל המעגל מחדש, ממקום מפותח יותר.'}
];
function openJourneyStage(i){const d=journeyStageDetails[i];if(!d)return;document.getElementById('ap-journey-dialog')?.remove();const backdrop=document.createElement('div');backdrop.id='ap-journey-dialog';backdrop.className='ap-stage-backdrop';backdrop.setAttribute('role','presentation');const dialog=document.createElement('div');dialog.className='ap-stage-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby','ap-stage-title');dialog.dir='rtl';const close=document.createElement('button');close.type='button';close.className='ap-stage-close';close.setAttribute('aria-label','סגירה');close.textContent='×';close.onclick=()=>backdrop.remove();const caption=document.createElement('span');caption.className='ap-eyebrow';caption.textContent='שלב '+d.grade+' · מעגל ההתפתחות השנתי';const title=document.createElement('h2');title.id='ap-stage-title';title.textContent=d.title;const p=document.createElement('p');p.textContent=d.body;dialog.append(close,caption,title,p);backdrop.append(dialog);backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.remove()});backdrop.addEventListener('keydown',e=>{if(e.key==='Escape')backdrop.remove()});document.body.append(backdrop);close.focus()}
function moveAboutCarousel(direction){const track=document.getElementById('ap-principles-carousel');if(!track)return;const items=[...track.querySelectorAll('.ap-chapter')];if(!items.length)return;const current=items.reduce((best,item,i)=>Math.abs(item.getBoundingClientRect().right-track.getBoundingClientRect().right)<Math.abs(items[best].getBoundingClientRect().right-track.getBoundingClientRect().right)?i:best,0);const next=Math.max(0,Math.min(items.length-1,current+direction));items[next].scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'});const count=document.getElementById('ap-carousel-count');if(count)count.textContent=String(next+1).padStart(2,'0')+' / 06';}
function infoPage(kind){if(kind==='about')return aboutStory();view('<div class="shell"><div class="catalogue-heading"><span class="eyebrow">שורשים וכנפיים</span><h2>איך עובד המסע?</h2><p>מתחילים בהיכרות קצרה, עונים על 20 שאלות, מגלים תחומי עניין ובוחרים הזדמנויות לשנה הקרובה ולעתיד.</p><div class="actions"><button onclick="location.hash=\'#start\'">לשאלון האישי ←</button><button class="secondary" onclick="location.hash=\'#catalog\'">מפת ההזדמנויות</button></div></div></div>')}
function route(){let h=location.hash.slice(1);if(['quiz','profile','choose','journey'].includes(h)&&!hasIntroduction()){location.hash='#start';h='start';}document.body.classList.toggle('home-page',!h||h==='home');({start,quiz,profile,choose,journey,catalog,home,how:()=>infoPage('how'),about:()=>infoPage('about'),development:developmentPage}[h]||home)()}addEventListener("hashchange",route);route();
