async function downloadJourneyPdf(button){

 if(!source)return;
 const original=button.textContent;
 button.disabled=true;
 button.textContent="מכינים את הקובץ...";
 let staging;
 try{
  if(!window.html2pdf){
   await new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
    script.onload=resolve;script.onerror=()=>reject(new Error("PDF library unavailable"));
    document.head.appendChild(script);
   });
  }
  staging=source.cloneNode(true);
  staging.className="pdf-render-document";
  // Keep the source inside the viewport: html2canvas skips far-offscreen nodes.
  staging.style.cssText="display:block!important;position:fixed!important;top:0!important;left:0!important;width:760px!important;max-width:760px!important;opacity:1!important;visibility:visible!important;z-index:2147483646!important;background:white!important;pointer-events:none!important;overflow:visible!important;";
  staging.querySelectorAll("button,.growth-actions,.stepper").forEach(n=>n.remove());
  document.body.appendChild(staging);
  await document.fonts.ready;
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  if(!staging.getBoundingClientRect().width||!staging.textContent.trim())throw new Error("Empty PDF source");
  const safeName=String(state.name||"תלמיד").replace(/[\\/:*?"<>|]/g,"").trim()||"תלמיד";
  const filename="מפת הצמיחה והבחירות - "+safeName+".pdf";
  await window.html2pdf().set({
   margin:[9,9,9,9],filename,
   image:{type:"jpeg",quality:0.95},
   html2canvas:{scale:1,useCORS:true,backgroundColor:"#ffffff",scrollY:0,windowWidth:800},
   jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
   pagebreak:{mode:["css","legacy"],avoid:[".growth-opportunity",".growth-story-item",".journey-chosen-grid>div"]}
  }).from(staging).save();
 }catch(e){
  console.error("PDF download failed",e);
  alert("לא הצלחנו להוריד את הקובץ כרגע. אפשר להשתמש בכפתור ההדפסה ולבחור שמירה כ־PDF.");
 }finally{
  if(staging)staging.remove();
  button.textContent=original;
  button.disabled=false;
 }
}

const ABOUT_CHAPTERS=[
{title:'כל תלמיד הוא סיפור של צמיחה',sub:'לגלות את מה שיש בי. להצמיח את מה שעוד יכול להיות.',text:['במקיף ז׳ אשדוד אנו מאמינים כי בכל תלמיד ותלמידה טמון עולם של יכולות, כישרונות, תחומי עניין ואפשרויות. חלקם כבר באים לידי ביטוי, אחרים ממתינים להזדמנות להתגלות, ויש כאלה שעוד יצמחו ויתפתחו לאורך הדרך.','התלמיד שנכנס בשערי בית הספר בכיתה ז׳ אינו אותו תלמיד שייצא מהם בסיום כיתה י״ב. במהלך שש שנות הלימוד הוא מתנסה, מגלה, משתנה, רוכש מיומנויות, מתמודד עם אתגרים ומפתח את זהותו האישית.'],img:'about-strip-1.png'},

{title:'עולם של הזדמנויות, לא מסלול אחד',sub:'לגלות אפשרויות שלא הכרנו.',text:['בית הספר מציע מגוון תוכניות, מסלולי העשרה, תחרויות, יוזמות, נבחרות ומרחבי עשייה בתחומי המדעים, החברה והרוח, האמנות, הספורט והמנהיגות.','לא תמיד התלמידים והוריהם מכירים את כל האפשרויות. ״שורשים וכנפיים״ נולד כדי להפוך את ההזדמנויות לנגישות, מוכרות ואישיות — ולעודד גילוי של עולמות חדשים.'],img:'about-strip-6.png'},

['לגדול, להשתנות ולגלות את עצמי מחדש','היכולות שלנו ממשיכות להתפתח.',['בכל שנה נפתחות בפני התלמידים אפשרויות חדשות, ובכל התנסות עשויה להתגלות יכולת שלא הכירו בעצמם.','לכל תלמיד יש חוזקות, אך החוזקות אינן קבועות ואינן מגדירות את גבולות יכולותיו. אפשר להעמיק את מה שכבר קיים, לרכוש כישורים חדשים, לפתח תחומי עניין שלא הכרנו ולגלות בעצמנו צדדים נוספים.']],
['מכיתה ז׳ עד י״ב — לא מפסיקים לגלות','שש שנים של גילוי, התנסות וצמיחה.',['לאורך שנות הלימוד משתנים תחומי העניין, מתפתחות מיומנויות ונבנית הזהות האישית. בכל שנה נפתחות דלתות חדשות ללמידה, לאחריות, ליוזמה ולהיכרות עם יכולות שעדיין לא הכרנו.']],

view('<div class="ap-about" dir="rtl"><div class="ap-about-image-banner"><img src="/hero-about.png" alt="אודות · שורשים וכנפיים" loading="eager"></div><section class="ap-intro ap-unified-intro ap-single-philosophy"><div class="ap-intro-title"><span class="ap-eyebrow">התפיסה החינוכית שלנו · העקרונות שמובילים אותנו</span><h2><span class="ap-about-heading-navy">שורשים שמעניקים ביטחון</span><span class="ap-about-heading-teal">וכנפיים שפותחות אפשרויות.</span></h2></div><div class="ap-philosophy-copy"><p>״שורשים וכנפיים״ מציע מסע התפתחותי שש־שנתי, המאפשר לכל תלמיד ותלמידה להעמיק את ההיכרות עם עצמם, לגלות חוזקות וכישרונות, להיחשף לעולמות תוכן חדשים ולהכיר מגוון אפיקי מצוינות והתפתחות.</p><p>באמצעות פלטפורמה דיגיטלית אישית, נפרש בפני כל תלמיד ותלמידה עולם של הזדמנויות בית־ספריות, עירוניות וארציות, המותאמות לשלב שבו הם נמצאים במסע. הפלטפורמה מנגישה תוכניות, מסלולי העשרה, יוזמות, תחרויות ומרחבי עשייה, ומאפשרת לגלות אפשרויות חדשות, להתנסות ולבחור מתוך תחומי העניין, החוזקות והשאיפות האישיות.</p><p>לאורך שש שנות הלימוד המסע מתחדש ומתפתח. בכל שנה נפתחים אופקים נוספים, מתגלות יכולות חדשות ומתרחבות האפשרויות לבחירה, להעמקה ולצמיחה. זהו מסע הנשען על שורשים של זהות, ערכים ושייכות, ומעניק כנפיים להעז, לחלום, ליזום ולמצוא את הדרך האישית להגשמה ולמשמעות.</p></div></section><section class="ap-story" id="about-principles"><div class="ap-story-heading"><h2><span class="ap-story-line-dark">לא רק לאן מגיעים.</span><span class="ap-story-line-turquoise">גם למי הופכים בדרך.</span></h2><p class="ap-section-intro">ששת העקרונות מבטאים את האמונה שלנו בכל תלמיד ותלמידה ואת הדרך שבה אנו רואים מצוינות, שייכות ואפשרויות לצמיחה.</p></div><div class="ap-carousel-controls"><span class="ap-carousel-counter" id="ap-carousel-count" aria-live="polite">01 / 06</span><div class="ap-carousel-buttons"><button type="button" class="ap-carousel-btn ap-carousel-prev" onclick="moveAboutCarousel(-1)" aria-label="לעיקרון הקודם"><svg class="ap-nav-arrow" viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="ap-carousel-btn ap-carousel-next" onclick="moveAboutCarousel(1)" aria-label="לעיקרון הבא"><svg class="ap-nav-arrow" viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div><div class="ap-chapters" id="ap-principles-carousel" role="region" aria-label="קרוסלת ששת העקרונות" tabindex="0">'+chapters+'</div></section><div class="ap-next-page"><span>ממשיכים מהחזון אל המעשה</span><h2>איך נראית הצמיחה בפועל?</h2><p>בכל שנה התלמידים חוזרים למעגל של גילוי, חשיפה, התנסות, בחירה והשפעה.</p><a href="#development">למסע ההתפתחות ←</a></div><section class="ap-ending"><span class="ap-eyebrow">שורשים בלב. כנפיים לעתיד.</span><h2>המסע שלי. <em>העתיד שלי.</em></h2><p>לא רק מי אני היום — גם מי אני יכול להיות מחר.</p><a href="#start">מתחילים במסע <span aria-hidden="true">←</span></a></section></div>');

function openJourneyStage(i){const d=journeyStageDetails[i];if(!d)return;document.getElementById('ap-journey-dialog')?.remove();const backdrop=document.createElement('div');backdrop.id='ap-journey-dialog';backdrop.className='ap-stage-backdrop';backdrop.setAttribute('role','presentation');const dialog=document.createElement('div');dialog.className='ap-stage-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-labelledby','ap-stage-title');dialog.dir='rtl';const close=document.createElement('button');close.type='button';close.className='ap-stage-close';close.setAttribute('aria-label','סגירה');close.textContent='×';close.onclick=()=>backdrop.remove();const caption=document.createElement('span');caption.className='ap-eyebrow';caption.textContent='שלב '+d.grade+' · מעגל ההתפתחות השנתי';const title=document.createElement('h2');title.id='ap-stage-title';title.textContent=d.title;const p=document.createElement('p');p.textContent=d.body;dialog.append(close,caption,title,p);backdrop.append(dialog);backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.remove()});backdrop.addEventListener('keydown',e=>{if(e.key==='Escape')backdrop.remove()});document.body.append(backdrop);close.focus()}
function moveAboutCarousel(direction){const track=document.getElementById('ap-principles-carousel');if(!track)return;const items=[...track.querySelectorAll('.ap-chapter')];if(!items.length)return;const current=items.reduce((best,item,i)=>Math.abs(item.getBoundingClientRect().right-track.getBoundingClientRect().right)<Math.abs(items[best].getBoundingClientRect().right-track.getBoundingClientRect().right)?i:best,0);const next=Math.max(0,Math.min(items.length-1,current+direction));items[next].scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'});const count=document.getElementById('ap-carousel-count');if(count)count.textContent=String(next+1).padStart(2,'0')+' / 06';}
function infoPage(kind){if(kind==='about')return aboutStory();view('<div class="shell"><div class="catalogue-heading"><span class="eyebrow">שורשים וכנפיים</span><h2>איך עובד המסע?</h2><p>מתחילים בהיכרות קצרה, עונים על 20 שאלות, מגלים תחומי עניין ובוחרים הזדמנויות לשנה הקרובה ולעתיד.</p><div class="actions"><button onclick="location.hash=\'#start\'">לשאלון האישי ←</button><button class="secondary" onclick="location.hash=\'#catalog\'">מפת ההזדמנויות</button></div></div></div>')}
function route(){let h=location.hash.slice(1);if(['quiz','profile','choose','journey'].includes(h)&&!hasIntroduction()){location.hash='#start';h='start';}document.body.classList.toggle('home-page',!h||h==='home');({start,quiz,profile,choose,journey,catalog,home,how:()=>infoPage('how'),about:()=>infoPage('about'),development:developmentPage}[h]||home)()}addEventListener("hashchange",route);route();
