const dims=["מדע וחקר","טכנולוגיה וחדשנות","חברה ורוח","אמנות ויצירה","מנהיגות ויוזמה","ספורט ואתגר"];

function home(){document.body.classList.add('home-page');view('<section class="approved-hero" aria-label="שורשים וכנפיים – המסע שלי, העתיד שלי"><img src="/hero-home.png" alt="שורשים וכנפיים – המסע שלי, העתיד שלי. מגלים חוזקות, בוחרים מסלולים ויוצרים מפת צמיחה אישית. מכיתה ז׳ עד י״ב"><a class="hero-hotspot hs-start" href="#start" aria-label="מתחילים עכשיו"></a><a class="hero-hotspot hs-discover" href="#about" aria-label="לגלות עוד"></a></section>')}
function start(){view('<div class="shell"><div class="stepper"><span>01 • היכרות</span><span>02 • שאלון</span><span>03 • הפרופיל שלי</span><span>04 • בחירת מסלולים</span></div><h2>נעים להכיר</h2><div class="card"><label>הכינוי שלי<input id="nick" type="text" maxlength="32" value="'+(state.name||'')+'"></label><label>שכבה<select id="grade">'+["ז׳","ח׳","ט׳","י׳","י״א","י״ב"].map(g=>'<option '+(state.grade===g?'selected':'')+'>'+g+'</option>').join('')+'</select></label><label>כיתה<input id="klass" type="text" value="'+state.klass+'"></label><div class="actions"><button onclick="state.name=document.querySelector(\'#nick\').value||\'סקרנ/ית\';state.grade=document.querySelector(\'#grade\').value;state.klass=document.querySelector(\'#klass\').value;save();location.hash=\'#quiz\'">יוצאים למסע ←</button></div><p class="muted">בגרסת ההדגמה הנתונים נשמרים בדפדפן בלבד.</p></div></div>')}
function quiz(){const q=Q[state.idx],selected=state.answers[state.idx]||[];view('<div class="shell"><div class="stepper"><span>01 • היכרות</span><span class="active-step">02 • שאלון</span><span>03 • הפרופיל שלי</span><span>04 • בחירת מסלולים</span></div>'+tag("שאלה "+(state.idx+1)+" מתוך 20")+'<div class="card"><div class="bar"><span style="width:'+((state.idx+1)*5)+'%"></span></div><h2>'+q[0]+'</h2><p class="muted">בחרו עד '+q[2]+' תשובות</p><div class="grid">'+q[1].split("|").map((o,i)=>'<label class="choice"><input type="checkbox" '+(selected.includes(i)?'checked':'')+' onchange="answer('+i+')"> '+o+'</label>').join('')+'</div><div class="actions"><button class="secondary" onclick="state.idx=Math.max(0,state.idx-1);save();quiz()">הקודמת</button><button '+(!selected.length?'disabled':'')+' onclick="state.idx<19?(state.idx++,save(),quiz()):(location.hash=\'#profile\')">'+(state.idx===19?'לפרופיל שלי':'הבאה')+' ←</button></div></div></div>')}
function answer(i){let a=state.answers[state.idx]||[],mx=Q[state.idx][2];a=a.includes(i)?a.filter(x=>x!==i):a.length<mx?[...a,i]:a;state.answers[state.idx]=a;save();quiz()}
function ranked(){const scores=Array(6).fill(0);Object.entries(state.answers).forEach(([q,ids])=>ids.forEach(i=>{let w=(Number(q)+i)%6;scores[w]+=1;let opt=Q[Number(q)][1].split("|")[i]||"";if(/חבר|אנש|חברתי|היסטור|תרבות|פילוסופ|שפות|סיפור/.test(opt))scores[2]+=2;if(/מדע|חקר|ניסוי|רפוא|חלל/.test(opt))scores[0]+=2;if(/מחשב|תכנות|רובוט|משחק/.test(opt))scores[1]+=2;if(/אמנות|מוזיקה|עיצוב|כתיבה|צילום|סרט/.test(opt))scores[3]+=2;if(/מנהיג|מוביל|עזרה|התנדב|יוזמ/.test(opt))scores[4]+=2;if(/ספורט|התמד|תחרות/.test(opt))scores[5]+=2}));let max=Math.max(1,...scores);return scores.map((x,i)=>({name:dims[i],v:Math.round(x/max*100)})).sort((a,b)=>b.v-a.v)}
function profile(){if(!Object.keys(state.answers).length)return location.hash="#start";let d=ranked(), rec=programs.filter((x,i)=> d[0].name.includes("חברה")?/היסטור|תנ״ך|דן דוד|תרבות/.test(x):d[0].name.includes("מדע")?/אקדמ|חלל|ביולוג|פיזיק/.test(x):true).slice(0,4);while(rec.length<4)rec.push(programs[rec.length]);view('<div class="shell"><div class="stepper"><span>01 • היכרות</span><span>02 • שאלון</span><span class="active-step">03 • הפרופיל שלי</span><span>04 • בחירת מסלולים</span></div>'+tag("פרופיל הצמיחה שלך")+'<h2>'+state.name+', יש לך רעיונות. עכשיו אפשר לתת להם כנפיים.</h2><div class="card">מהבחירות שלך עולה עניין במיוחד ב<strong> '+d.slice(0,2).map(x=>x.name).join(" וב־")+'</strong>. אלה העדפות שמסמנות כיוונים להתנסות, ולא אבחון של היכולות שלך.</div><h2>החוזקות והנטיות שעולות מהתשובות</h2><div class="grid">'+d.slice(0,4).map(x=>'<div class="card">'+tag("✦")+'<h3>'+x.name+'</h3>תחום שיכול לפתוח עבורך אפשרויות חדשות</div>').join('')+'</div><h2>מפת תחומי העניין שלך</h2><p class="muted">מדדים יחסיים לצורך הדגמה, לא ציון מאומת.</p>'+d.map(x=>'<p>'+x.name+' · '+x.v+'/100</p><div class="bar"><span style="width:'+x.v+'%"></span></div>').join('')+'<h2>התוכניות שהייתי מציע לך לבדוק</h2>'+rec.map((x,i)=>'<div class="card">'+tag("המלצה "+(i+1))+'<h3>'+x+'</h3><p>מסלול שכדאי לבדוק בהקשר של תחומי העניין שלך.</p><p class="muted">מועד הצטרפות ותנאי קבלה: טרם אומתו</p></div>').join('')+'<button onclick="location.hash=\'#choose\'">לבחירת תוכניות ←</button></div>')}
function choose(){view('<div class="shell"><div class="stepper"><span>01 • היכרות</span><span>02 • שאלון</span><span>03 • הפרופיל שלי</span><span class="active-step">04 • בחירת מסלולים</span></div><h2>הבחירות שלי</h2><p>בחרו לפחות מסלול אחד לשנה ושני מסלולים לשנים הבאות.</p><h3>השנה אני רוצה...</h3><div class="grid">'+programs.map((p,i)=>'<label class="choice"><input type="checkbox" '+(state.current.includes(i)?'checked':'')+' onchange="pick('+i+',\'current\')">'+p+'</label>').join('')+'</div><h3>בשנים הבאות...</h3><p>'+state.future.length+'/2</p><div class="grid">'+programs.map((p,i)=>'<label class="choice"><input type="checkbox" '+(state.future.includes(i)?'checked':'')+(state.future.length>=2&&!state.future.includes(i)?' disabled':'')+' onchange="pick('+i+',\'future\')">'+p+'</label>').join('')+'</div><div class="actions"><button '+(!state.current.length||state.future.length!==2?'disabled':'')+' onclick="location.hash=\'#journey\'">לסיכום הבחירות ←</button></div></div>')}

function showProgram(i){let p=programDetails[i];if(!p)return;document.querySelector('#programDialog')?.remove();let div=document.createElement('div');div.id='programDialog';div.className='modal-shade';div.innerHTML='<section class="modal-panel" role="dialog" aria-modal="true" aria-label="'+escapeHtml(p.name)+'"><button class="modal-close" onclick="document.getElementById(\'programDialog\').remove()">✕</button><span class="category-caption">'+escapeHtml(p.category)+' · '+escapeHtml(p.scope)+'</span><h2>'+escapeHtml(p.name)+'</h2><p>'+escapeHtml(p.desc)+'</p><h3>קהל יעד</h3><p>'+escapeHtml(p.audience)+'</p><p class="muted">המידע מבוסס על מאגר התוכניות המקורי. התאמה לשכבה, מועדי הרשמה ופרטי קשר טרם אומתו.</p><button onclick="document.getElementById(\'programDialog\').remove()">סגירה</button></section>';div.onclick=e=>{if(e.target===div)div.remove()};document.body.append(div)}

function catalog(resetScroll=true){const search=window.rwCatalogSearch||'',filter=window.rwCatalogFilter||'הכול';let list=programDetails.map((p,i)=>({...p,i})).filter(p=>(filter==='הכול'||p.category===filter)&&(!search||[p.name,p.desc,p.audience,p.category].some(t=>t.includes(search))));view('<div class="shell catalogue"><div class="catalogue-heading"><span class="eyebrow">מפת ההזדמנויות</span><h2>לכל סקרנות יש מסלול</h2><p>מגוון מסלולים והזדמנויות לצמיחה, למצוינות, ליצירה, לחקר, למנהיגות ולהתפתחות אישית.</p></div><div class="catalogue-controls"><label class="search-label" for="catalogSearch">מחפשים הזדמנות מסוימת?</label><div class="search-field"><span class="search-icon" aria-hidden="true">⌕</span><input id="catalogSearch" type="search" autocomplete="off" placeholder="שם תוכנית, תחום עניין או מילת מפתח..." value="'+escapeHtml(search)+'" oninput="filterCatalog(this.value)"></div><div class="filter-row">'+['הכול','מדע וטכנולוגיה','חברה ורוח','חברה ומנהיגות','אמנות ויצירה','ספורט ואתגר','מצוינות אישית'].map(v=>'<button class="filter-btn '+(filter===v?'active':'')+'" onclick="window.rwCatalogFilter=\''+v+'\';catalog()">'+v+'</button>').join('')+'</div></div><p class="catalog-count">'+list.length+' תוכניות בתצוגה</p><div class="program-grid">'+list.map(p=>programCard(p,p.i)).join('')+'</div><p class="notice-soft">התיאורים וקהל היעד לקוחים מהקוד המקורי. מועדי הרשמה וזכאות אישית יופיעו לאחר אימות נתוני השנה.</p></div>')}
const ABOUT_CHAPTERS=[
{title:'כל תלמיד הוא סיפור של צמיחה',sub:'לגלות את מה שיש בי. להצמיח את מה שעוד יכול להיות.',text:['במקיף ז׳ אשדוד אנו מאמינים כי בכל תלמיד ותלמידה טמון עולם של יכולות, כישרונות, תחומי עניין ואפשרויות. חלקם כבר באים לידי ביטוי, אחרים ממתינים להזדמנות להתגלות, ויש כאלה שעוד יצמחו ויתפתחו לאורך הדרך.','התלמיד שנכנס בשערי בית הספר בכיתה ז׳ אינו אותו תלמיד שייצא מהם בסיום כיתה י״ב. במהלך שש שנות הלימוד הוא מתנסה, מגלה, משתנה, רוכש מיומנויות, מתמודד עם אתגרים ומפתח את זהותו האישית.'],img:'about-strip-1.png'},
{title:'לגדול, להשתנות ולגלות את עצמי מחדש',sub:'היכולות שלנו ממשיכות להתפתח.',text:['חלק מהכישרונות שלנו כבר באים לידי ביטוי. אחרים ממתינים להזדמנות להתגלות — ויש יכולות שעוד יצמחו לאורך הדרך.','בכל שנה, בכל מפגש ובכל התנסות אפשר לגלות משהו חדש על עצמנו. התלמידים אינם מוגדרים רק על ידי מה שהם יודעים לעשות היום.','מה מסקרן אותי? במה עוד הייתי רוצה להתנסות?'],img:'about-strip-2.png'},
{title:'מכיתה ז׳ עד י״ב — לא מפסיקים לגלות',sub:'שש שנים של התנסות, שינוי וצמיחה.',text:['התלמיד שנכנס בשערי בית הספר בכיתה ז׳ אינו אותו תלמיד שייצא מהם בסיום כיתה י״ב.','לאורך שש השנים הוא מתנסה, מגלה, משתנה, רוכש מיומנויות, מתמודד עם אתגרים ומפתח את זהותו האישית. כל שנה פותחת עוד אפשרות.'],img:'about-strip-3.png'},
{title:'מצוינות היא הרבה יותר מציונים',sub:'יש יותר מדרך אחת להצטיין.',text:['התפיסה החינוכית שלנו רואה בצמיחה האישית תהליך רב־ממדי, מתמשך והוליסטי.','מצוינות אינה נמדדת רק בהישגים לימודיים, אלא גם בסקרנות, ביצירתיות, בהתמדה, במנהיגות, בעשייה חברתית, בספורט, באמנות, בחשיבה ביקורתית ובאומץ להתנסות.','לא רק במה אני טוב היום — אלא גם מה עוד אוכל להיות.'],img:'about-strip-5.png'},
{title:'עולם של הזדמנויות, לא מסלול אחד',sub:'לגלות אפשרויות שלא הכרנו.',text:['בית הספר מציע מגוון תוכניות, מסלולי העשרה, תחרויות, יוזמות, נבחרות ומרחבי עשייה בתחומי המדעים, החברה והרוח, האמנות, הספורט והמנהיגות.','לא תמיד התלמידים והוריהם מכירים את כל האפשרויות. ״שורשים וכנפיים״ נולד כדי להפוך את ההזדמנויות לנגישות, מוכרות ואישיות — ולעודד גילוי של עולמות חדשים.'],img:'about-strip-6.png'},
{title:'שורשים שמעניקים ביטחון. כנפיים שפותחות אפשרויות.',sub:'המסע שלי. העתיד שלי.',text:['השורשים הם הזהות, הערכים, השייכות, החוזקות והבסיס שכל תלמיד בונה לאורך הדרך.','הכנפיים הן הסקרנות, ההתנסויות, המיומנויות החדשות, השאיפות והאומץ לצאת אל מעבר למוכר.','בין השורשים לכנפיים מתרחש מסע הצמיחה האישי של כל תלמיד ותלמידה.'],img:'about-strip-4.png'}

function aboutStory(){

['מכיתה ז׳ עד י״ב — לא מפסיקים לגלות','שש שנים של גילוי, התנסות וצמיחה.',['לאורך שנות הלימוד משתנים תחומי העניין, מתפתחות מיומנויות ונבנית הזהות האישית. בכל שנה נפתחות דלתות חדשות ללמידה, לאחריות, ליוזמה ולהיכרות עם יכולות שעדיין לא הכרנו.']],
['מצוינות היא הרבה יותר מציונים','יש יותר מדרך אחת להצטיין.',['התפיסה החינוכית שלנו רואה בצמיחה האישית תהליך רב־ממדי, מתמשך והוליסטי.','מצוינות אינה נמדדת רק בהישגים לימודיים, אלא גם בסקרנות, ביצירתיות, בהתמדה, במנהיגות, בעשייה חברתית, בספורט, באמנות, בחשיבה ביקורתית, ביוזמה ובאומץ להתנסות בדברים חדשים.']],
['עולם של הזדמנויות, לא מסלול אחד','ההזדמנות המתאימה עשויה להיות קרובה משחשבנו.',['בית הספר מציע תוכניות, מסלולי העשרה, תחרויות, יוזמות, נבחרות ומרחבי עשייה במדעים, בטכנולוגיה, בחברה וברוח, באמנות, בספורט ובמנהיגות.','״שורשים וכנפיים״ נולד כדי להפוך את האפשרויות לנגישות, מוכרות ואישיות — ולעודד בחירה מתוך סקרנות.']],
['שורשים שמעניקים ביטחון. כנפיים שפותחות אפשרויות.','המסע שלי. העתיד שלי.',['השורשים הם הזהות, הערכים, השייכות, החוזקות והבסיס שכל תלמיד בונה לאורך הדרך. הכנפיים הן הסקרנות, ההתנסויות, השאיפות והאומץ לצאת מעבר למוכר.','תפקידנו אינו רק לעזור לתלמידים להגיע להישגים, אלא לאפשר להם לגלות דרכים שונות לצמוח, להתפתח ולהגשים את עצמם.']]

view('<div class="ap-about" dir="rtl"><section class="ap-hero"><div class="ap-orbit ap-orbit-one"></div><div class="ap-orbit ap-orbit-two"></div><div class="ap-hero-inner"><span class="ap-eyebrow">מקיף ז׳ אשדוד <i></i> התפיסה החינוכית שלנו</span><h1>שורשים <span>וכנפיים</span></h1><p class="ap-claim">לגלות מי אני. <em>לבחור מי אהיה.</em></p><div class="ap-rule"></div><p class="ap-lead">מסע חינוכי של זהות, צמיחה, בחירה ואפשרויות. שש שנים שבהן כל תלמיד ותלמידה יכולים להעמיק שורשים, לפרוש כנפיים ולגלות דרכים חדשות להגשים את עצמם.</p></div><div class="ap-hero-foot"><span>זהות</span><b>✦</b><span>צמיחה</span><b>✦</b><span>בחירה</span><b>✦</b><span>משמעות</span></div></section><section class="ap-intro"><div class="ap-intro-title"><span class="ap-eyebrow">המצפן החינוכי שלנו</span><h2>קרקע יציבה.<br><em>אופק פתוח.</em></h2></div><p>אנחנו מאמינים שתפקידו של בית הספר הוא להעניק לכל תלמיד ותלמידה גם תחושת שייכות וביטחון וגם הזדמנויות להעז, להתנסות ולמצוא את הדרך האישית שלהם.</p></section><section class="ap-pillars"><article class="ap-pillar ap-roots"><span class="ap-pillar-no">01 / שורשים</span><div class="ap-pillar-mark">שורשים<span>—</span></div><h3>הבסיס שממנו צומחים</h3><p>זהות, ערכים, שייכות, חוזקות וביטחון פנימי. כל מה שמעניק קרקע יציבה להכיר את עצמי ולהאמין בדרך שלי.</p><div class="ap-tags"><span>זהות</span><span>שייכות</span><span>ערכים</span></div></article><article class="ap-pillar ap-wings"><span class="ap-pillar-no">02 / כנפיים</span><div class="ap-pillar-mark">כנפיים<span>↗</span></div><h3>האומץ לצאת אל האפשרי</h3><p>סקרנות, התנסות, חלומות, בחירה ויוזמה. כל מה שפותח אפשרויות חדשות מעבר למה שכבר מוכר.</p><div class="ap-tags"><span>גילוי</span><span>בחירה</span><span>צמיחה</span></div></article></section><section class="ap-process"><span class="ap-eyebrow">הדרך שלנו</span><div class="ap-process-grid"><article><span>01</span><h3>לגלות</h3><p>להכיר כישרונות, חוזקות ותחומי עניין.</p></article><article><span>02</span><h3>להתנסות</h3><p>לפתוח דלתות ללמידה, לעשייה וליוזמה.</p></article><article><span>03</span><h3>לבחור</h3><p>ליצור מסלול אישי של צמיחה ומשמעות.</p></article></div></section><section class="ap-story"><div class="ap-story-heading"><span class="ap-eyebrow">הסיפור שלנו</span><h2>לא רק לאן מגיעים.<br><em>גם למי הופכים בדרך.</em></h2></div><div class="ap-chapters">'+chapters+'</div></section><section class="ap-journey"><span class="ap-eyebrow">שש שנים של התפתחות</span><h2>המסע שלי <em>ז׳ — י״ב</em></h2><p>בכל שנה נפתחת אפשרות חדשה: להכיר, לנסות, לבחור ולצמוח.</p><div class="ap-stages">'+stages+'</div></section><section class="ap-ending"><span class="ap-eyebrow">שורשים בלב. כנפיים לעתיד.</span><h2>המסע שלי.<br><em>העתיד שלי.</em></h2><p>לא רק מי אני היום — גם מי אני יכול להיות מחר.</p><a href="#start">מתחילים במסע <span aria-hidden="true">←</span></a></section></div>');
}
function infoPage(kind){if(kind==='about')return aboutStory();view('<div class="shell"><div class="catalogue-heading"><span class="eyebrow">שורשים וכנפיים</span><h2>איך עובד המסע?</h2><p>מתחילים בהיכרות קצרה, עונים על 20 שאלות, מגלים תחומי עניין ובוחרים הזדמנויות לשנה הקרובה ולעתיד.</p><div class="actions"><button onclick="location.hash=\'#start\'">לשאלון האישי ←</button><button class="secondary" onclick="location.hash=\'#catalog\'">מפת ההזדמנויות</button></div></div></div>')}
