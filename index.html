["איזו דלת היית רוצה לפתוח?","מדע ומחקר|טכנולוגיה|אמנות|מנהיגות|חברה וקהילה|ספורט|רפואה|שפות ותרבויות|משפט ופילוסופיה",3]

const dims=["מדע וחקר","טכנולוגיה וחדשנות","חברה ורוח","אמנות ויצירה","מנהיגות ויוזמה","ספורט ואתגר"];
const programDetails=window.RW_PROGRAMS||[];const programs=programDetails.map(p=>p.name);

function save(){localStorage.setItem("rw-demo",JSON.stringify(state))}function tag(s){return '<span class="tag">'+s+'</span>'}function view(s){const page=location.hash.slice(1);const images={about:['hero-about.png','אודות'],catalog:['hero-opportunities.png','מפת ההזדמנויות'],start:['hero-journey.png','מתחילים במסע'],quiz:['hero-journey.png','מתחילים במסע'],profile:['hero-journey.png','מתחילים במסע'],choose:['hero-my-choices.png','הבחירות שלי'],journey:['hero-my-choices.png','הבחירות שלי']};const info=images[page];const banner=info?'<section class="interior-hero" aria-label="'+info[1]+'"><img src="/'+info[0]+'" alt="'+info[1]+' – שורשים וכנפיים"></section>':'';document.querySelector("#app").innerHTML=banner+s;window.scrollTo(0,0)}
function home(){document.body.classList.add('home-page');view('<section class="approved-hero" aria-label="שורשים וכנפיים – המסע שלי, העתיד שלי"><img src="/hero-home.png" alt="שורשים וכנפיים – המסע שלי, העתיד שלי. מגלים חוזקות, בוחרים מסלולים ויוצרים מפת צמיחה אישית. מכיתה ז׳ עד י״ב"><a class="hero-hotspot hs-start" href="#start" aria-label="מתחילים עכשיו"></a><a class="hero-hotspot hs-discover" href="#about" aria-label="לגלות עוד"></a></section>')}

function answer(i){let a=state.answers[state.idx]||[],mx=Q[state.idx][2];a=a.includes(i)?a.filter(x=>x!==i):a.length<mx?[...a,i]:a;state.answers[state.idx]=a;save();quiz()}
function ranked(){const scores=Array(6).fill(0);Object.entries(state.answers).forEach(([q,ids])=>ids.forEach(i=>{let w=(Number(q)+i)%6;scores[w]+=1;let opt=Q[Number(q)][1].split("|")[i]||"";if(/חבר|אנש|חברתי|היסטור|תרבות|פילוסופ|שפות|סיפור/.test(opt))scores[2]+=2;if(/מדע|חקר|ניסוי|רפוא|חלל/.test(opt))scores[0]+=2;if(/מחשב|תכנות|רובוט|משחק/.test(opt))scores[1]+=2;if(/אמנות|מוזיקה|עיצוב|כתיבה|צילום|סרט/.test(opt))scores[3]+=2;if(/מנהיג|מוביל|עזרה|התנדב|יוזמ/.test(opt))scores[4]+=2;if(/ספורט|התמד|תחרות/.test(opt))scores[5]+=2}));let max=Math.max(1,...scores);return scores.map((x,i)=>({name:dims[i],v:Math.round(x/max*100)})).sort((a,b)=>b.v-a.v)}
function profile(){if(!Object.keys(state.answers).length)return location.hash="#start";let d=ranked(), rec=programs.filter((x,i)=> d[0].name.includes("חברה")?/היסטור|תנ״ך|דן דוד|תרבות/.test(x):d[0].name.includes("מדע")?/אקדמ|חלל|ביולוג|פיזיק/.test(x):true).slice(0,4);while(rec.length<4)rec.push(programs[rec.length]);view('<div class="shell"><div class="stepper"><span>01 • היכרות</span><span>02 • שאלון</span><span class="active-step">03 • הפרופיל שלי</span><span>04 • בחירת מסלולים</span></div>'+tag("פרופיל הצמיחה שלך")+'<h2>'+state.name+', יש לך רעיונות. עכשיו אפשר לתת להם כנפיים.</h2><div class="card">מהבחירות שלך עולה עניין במיוחד ב<strong> '+d.slice(0,2).map(x=>x.name).join(" וב־")+'</strong>. אלה העדפות שמסמנות כיוונים להתנסות, ולא אבחון של היכולות שלך.</div><h2>החוזקות והנטיות שעולות מהתשובות</h2><div class="grid">'+d.slice(0,4).map(x=>'<div class="card">'+tag("✦")+'<h3>'+x.name+'</h3>תחום שיכול לפתוח עבורך אפשרויות חדשות</div>').join('')+'</div><h2>מפת תחומי העניין שלך</h2><p class="muted">מדדים יחסיים לצורך הדגמה, לא ציון מאומת.</p>'+d.map(x=>'<p>'+x.name+' · '+x.v+'/100</p><div class="bar"><span style="width:'+x.v+'%"></span></div>').join('')+'<h2>התוכניות שהייתי מציע לך לבדוק</h2>'+rec.map((x,i)=>'<div class="card">'+tag("המלצה "+(i+1))+'<h3>'+x+'</h3><p>מסלול שכדאי לבדוק בהקשר של תחומי העניין שלך.</p><p class="muted">מועד הצטרפות ותנאי קבלה: טרם אומתו</p></div>').join('')+'<button onclick="location.hash=\'#choose\'">לבחירת תוכניות ←</button></div>')}

function showProgram(i){let p=programDetails[i];if(!p)return;document.querySelector('#programDialog')?.remove();let div=document.createElement('div');div.id='programDialog';div.className='modal-shade';div.innerHTML='<section class="modal-panel" role="dialog" aria-modal="true" aria-label="'+escapeHtml(p.name)+'"><button class="modal-close" onclick="document.getElementById(\'programDialog\').remove()">✕</button><span class="category-caption">'+escapeHtml(p.category)+' · '+escapeHtml(p.scope)+'</span><h2>'+escapeHtml(p.name)+'</h2><p>'+escapeHtml(p.desc)+'</p><h3>קהל יעד</h3><p>'+escapeHtml(p.audience)+'</p><p class="muted">המידע מבוסס על מאגר התוכניות המקורי. התאמה לשכבה, מועדי הרשמה ופרטי קשר טרם אומתו.</p><button onclick="document.getElementById(\'programDialog\').remove()">סגירה</button></section>';div.onclick=e=>{if(e.target===div)div.remove()};document.body.append(div)}
function filterCatalog(value){window.rwCatalogSearch=value;const pos=document.activeElement?.selectionStart||value.length;catalog(false);const field=document.getElementById('catalogSearch');if(field){field.focus({preventScroll:true});field.setSelectionRange(pos,pos)}}
function catalog(resetScroll=true){const search=window.rwCatalogSearch||'',filter=window.rwCatalogFilter||'הכול';let list=programDetails.map((p,i)=>({...p,i})).filter(p=>(filter==='הכול'||p.category===filter)&&(!search||[p.name,p.desc,p.audience,p.category].some(t=>t.includes(search))));view('<div class="shell catalogue"><div class="catalogue-heading"><span class="eyebrow">מפת ההזדמנויות</span><h2>לכל סקרנות יש מסלול</h2><p>מגוון מסלולים והזדמנויות לצמיחה, למצוינות, ליצירה, לחקר, למנהיגות ולהתפתחות אישית.</p></div><div class="catalogue-controls"><label class="search-label" for="catalogSearch">מחפשים הזדמנות מסוימת?</label><div class="search-field"><span class="search-icon" aria-hidden="true">⌕</span><input id="catalogSearch" type="search" autocomplete="off" placeholder="שם תוכנית, תחום עניין או מילת מפתח..." value="'+escapeHtml(search)+'" oninput="filterCatalog(this.value)"></div><div class="filter-row">'+['הכול','מדע וטכנולוגיה','חברה ורוח','חברה ומנהיגות','אמנות ויצירה','ספורט ואתגר','מצוינות אישית'].map(v=>'<button class="filter-btn '+(filter===v?'active':'')+'" onclick="window.rwCatalogFilter=\''+v+'\';catalog()">'+v+'</button>').join('')+'</div></div><p class="catalog-count">'+list.length+' תוכניות בתצוגה</p><div class="program-grid">'+list.map(p=>programCard(p,p.i)).join('')+'</div><p class="notice-soft">התיאורים וקהל היעד לקוחים מהקוד המקורי. מועדי הרשמה וזכאות אישית יופיעו לאחר אימות נתוני השנה.</p></div>')}
function aboutStory(){view('<div class="about-clean" dir="rtl"><section class="about-lead about-strip-demo"><span class="eyebrow">שורשים וכנפיים | התפיסה החינוכית שלנו</span><h1>כל תלמיד הוא סיפור של צמיחה</h1><p class="about-tagline">לגלות את מה שיש בי. להצמיח את מה שעוד יכול להיות.</p><p>במקיף ז׳ אשדוד אנו מאמינים כי בכל תלמיד ותלמידה טמון עולם של יכולות, כישרונות, תחומי עניין ואפשרויות. חלקם כבר באים לידי ביטוי, אחרים ממתינים להזדמנות להתגלות, ויש כאלה שעוד יצמחו ויתפתחו לאורך הדרך.</p><p>התלמיד שנכנס בשערי בית הספר בכיתה ז׳ אינו אותו תלמיד שייצא מהם בסיום כיתה י״ב. במהלך שש שנות הלימוד הוא מתנסה, מגלה, משתנה, רוכש מיומנויות, מתמודד עם אתגרים ומפתח את זהותו האישית.</p></section><section class="about-paragraph"><h2>מצוינות היא הרבה יותר מציונים</h2><p>התפיסה החינוכית שלנו רואה בצמיחה האישית תהליך רב־ממדי, מתמשך והוליסטי. אנו מאמינים שמצוינות אינה נמדדת רק בהישגים לימודיים, אלא גם בסקרנות, ביצירתיות, בהתמדה, במנהיגות, בעשייה חברתית, בספורט, באמנות, בחשיבה ביקורתית, ביוזמה ובאומץ להתנסות בדברים חדשים.</p><p>לכל תלמיד יש חוזקות, אך החוזקות אינן קבועות ואינן מגדירות את גבולות יכולותיו. אפשר להעמיק את מה שכבר קיים, לרכוש כישורים חדשים ולגלות בעצמנו צדדים נוספים.</p><blockquote>לא רק במה אתה טוב היום — אלא גם לאן עוד תוכל לצמוח?</blockquote></section><section class="about-paragraph"><h2>עולם של הזדמנויות, לא מסלול אחד</h2><p>לאורך שנות הלימוד מציע בית הספר מגוון רחב של תוכניות, מסלולי העשרה, תחרויות, יוזמות, נבחרות ומרחבי עשייה בתחומי המדעים, הטכנולוגיה, החברה והרוח, האמנות, הספורט, המנהיגות והמעורבות החברתית.</p><p>לא תמיד התלמידים והוריהם מכירים את מלוא האפשרויות העומדות בפניהם. ״שורשים וכנפיים״ נולד מתוך הרצון להפוך את מגוון ההזדמנויות הזה לנגיש, מוכר ואישי, ולעודד כל תלמיד לגלות גם עולמות חדשים.</p></section><section class="about-paragraph"><h2>שורשים שמעניקים ביטחון. כנפיים שפותחות אפשרויות.</h2><p>השורשים הם הזהות, הערכים, השייכות והבסיס שכל תלמיד בונה לאורך הדרך. הכנפיים הן הסקרנות, ההתנסויות, המיומנויות החדשות והאומץ לצאת אל מעבר למוכר.</p><p><strong>כי תפקידנו אינו רק לעזור לתלמידים להגיע להישגים, אלא לאפשר להם לגלות כמה דרכים שונות עומדות בפניהם לצמוח, להתפתח ולהגשים את עצמם.</strong></p><button onclick="location.hash=\'#start\'">מתחילים במסע ←</button></section></div>')}
function infoPage(kind){if(kind==='about')return aboutStory();view('<div class="shell"><div class="catalogue-heading"><span class="eyebrow">שורשים וכנפיים</span><h2>איך עובד המסע?</h2><p>מתחילים בהיכרות קצרה, עונים על 20 שאלות, מגלים תחומי עניין ובוחרים הזדמנויות לשנה הקרובה ולעתיד.</p><div class="actions"><button onclick="location.hash=\'#start\'">לשאלון האישי ←</button><button class="secondary" onclick="location.hash=\'#catalog\'">מפת ההזדמנויות</button></div></div></div>')}
function route(){let h=location.hash.slice(1);document.body.classList.toggle('home-page',!h||h==='home');({start,quiz,profile,choose,journey,catalog,home,how:()=>infoPage('how'),about:()=>infoPage('about')}[h]||home)()}addEventListener("hashchange",route);route();
</script></html>
